l_russian:


 #--------------------------------------------------------------
 # [Bulgaria] Army Effort
 #=========================================================================
 BUL_ww1_reorganize_the_bulgarian_army:0 "Сухопутные войска Болгарии"
 BUL_ww1_reorganize_the_bulgarian_army_desc:0 "Сухопутные войска Болгарии состояли из полевой армии (её запаса), резервной армии, народного ополчения и запасных войск. Запасные войска были сформированы после мобилизации для пополнения потерь действующей армии. Военное министерство состояло из штаба армии, канцелярии, главного интендантства, инспекций кавалерии, артиллерии и военно-инженерных подразделений, военно-судебной и военно-санитарной инспекций."
 
 BUL_ww1_trenchwarfare:0 "Позиционная война"
 BUL_ww1_trenchwarfare_desc:0 "Позиционная война — война, в которой вооружённая борьба ведётся, в основном, на сплошных, относительно стабильных фронтах (позициях) с глубокоэшелонированной обороной. Как правило, характеризуется высокой плотностью войск и развитым инженерным обеспечением позиций."
 
 BUL_ww1_artillery_effort_1:0 "Развитие артиллерии"
 BUL_ww1_artillery_effort_1_desc:0 "Первым шагом программы по модернизации армии станет дальнейшее развитие артиллерийских орудий. Сперва необходимо найти новых конструкторов, которые принесут нам плоды в виде новых проектов артиллерийских установок"
 
 BUL_ww1_artillery_effort_2:0 "Развитие артиллерии II"
 BUL_ww1_artillery_effort_2_desc:0 "После того, как мы собрали под своим крылом перспективных конструкторов, логично будет предоставить им свои собственные фабрики. Назначив конструкторов и инженеров на заводы, и приписав к ним рабочих, мы с уверенностью можем ожидать прорывов в области артиллерии."
 
 BUL_ww1_artillery_effort_3:0 "Развитие артиллерии III"
 BUL_ww1_artillery_effort_3_desc:0 "Полевые испытания выявили крупную проблему в артиллерийской отрасли: огромное количество модификаций и калибров наших орудий не только значительно увеличивает затраты на производство снарядов, но и снижает эффективность наших пушек на поле боя. Стандартизировав калибры наших пушек, мы в буквальном смысле получим больше выхлопа от наших инвестиций в эту отрасль."
 
 BUL_ww1_artillery_effort_4:0 "Развитие артиллерии IV"
 BUL_ww1_artillery_effort_4_desc:0 "Считалось, что орудия, стреляющие прямой наводкой, уйдут с полей сражений, однако к нам поступает все больше запросов на эти легкие пушки, а не на гаубицы и осадные орудия. Направив наши усилия на развитие таких орудий, а также на снаряды к ним, мы получим не только превосходные артиллерийские установки, но, возможно, и прогресс в других областях..."
 
 BUL_ww1_special_forces:0 "Силы специального назначения"
 BUL_ww1_special_forces_desc:0 "Несмотря на жестокость химических атак, именно они помогли выделить отряды, которые отличаются невероятной реакцией, превосходящей все остальные войска. Эти отряды могут стать полезными в качестве морских пехотинцев, горнострелковых войск и других подразделений, где выучка бойцов должна быть гораздо выше чем у обычной пехоты. Отыскав достаточно таких солдат и офицеров, мы сможем создать эффективные войска специального назначения. Эх, если бы только они могли вступать в бой так же быстро как старая добрая кавалерия..."
 
 BUL_ww1_army_motorization_focus:0 "Моторизация"
 BUL_ww1_army_motorization_focus_desc:0 "Великие умы нашего генштаба, а может просто люди, которым уже вдоволь надоела эта позиционная война, предложили нам начать массовое производство машин для наших войск, которые не только позволят им быстро достигать поля боя, но и совершать обходные действия. Конечно, этот простой замысел потребует от нас огромного количества снаряжения и длительного обучения наших войск, иными словами значительных инвестиций — хотя они могут легко окупиться в будущем."
 
 BUL_ww1_doctrine_effort:0 "Развитие доктрины"
 BUL_ww1_doctrine_effort_desc:0 "Хотя время, когда в генштабе заседали одни принцы, закончилось, некоторые наши офицеры и генералы получили звания не за свои заслуги, а благодаря кумовству. Разумеется, они являются одними из самых верных людей в государстве, но в других странах уже началось очищение от таких бесполезных кадров. Пора бы нам уже назначать на должности за заслуги и постараться выкинуть из командования весь этот сброд..."
 
 BUL_ww1_doctrine_effort_1:0 "Развитие доктрины" #Link me pls
 BUL_ww1_doctrine_effort_1_desc:0 "Теперь наш штаб укомплектован компетентными военачальниками, однако, они не единственные кто может развивать наши военные доктрины. Военные теоретики, отсутствующие как класс с 1800-х годов, вновь стали появляться на передовой военных исследований. Действительно, у них ограниченный опыт ведения боевых действий, но их изыскания нельзя просто игнорировать. Включив их в наш генштаб, мы значительно ускорим разработку военных тактик."    
 
 BUL_ww1_doctrine_effort_2:0 "Развитие доктрины II"
 BUL_ww1_doctrine_effort_2_desc:0  "Теперь наш штаб укомплектован компетентными военачальниками, однако, они не единственные кто может развивать наши военные доктрины. Военные теоретики, отсутствующие как класс с 1800-х годов, вновь стали появляться на передовой военных исследований. Действительно, у них ограниченный опыт ведения боевых действий, но их изыскания нельзя просто игнорировать. Включив их в наш генштаб, мы значительно ускорим разработку военных тактик."
 
 BUL_ww1_doctrine_effort_3:0 "Развитие доктрины III"
 BUL_ww1_doctrine_effort_3_desc:0 "До сих пор мы игнорировали один из самых ключевых элементов военных действий — Логистику. Помимо заботы о ведении самого боя, нам нужно обеспечить своевременные поставки еды, воды и снаряжения."
 
 BUL_ww1_equipment_effort:0 "Развитие снаряжения"
 BUL_ww1_equipment_effort_desc:0 ""
 
 BUL_ww1_equipment_effort_1:0 "Развитие снаряжения" #Link me pls
 BUL_ww1_equipment_effort_1_desc:0 "Генералы старой гвардии не являются единственной причиной, по которой наши войска застряли в прошлом веке. Наши квартирмейстеры подвержены коррупции и вообще не хотят взаимодействовать между собой. Необходимо заменить их наиболее ответственными и опытными офицерами, и таким образом мы сможем не только узнать недостатки нашего вооружения, но и не допустить того, чтобы эти люди стали СЛИШКОМ популярными." 
 
 BUL_ww1_equipment_effort_2:0 "Развитие снаряжения II" #Link me pls
 BUL_ww1_equipment_effort_2_desc:0 "Новые квартирмейстеры помимо нового вооружения запросили у нас и новые орудия поддержки пехоты. Обсуждения новой модели армии привели к появлению идей о легких пулеметах, окопных минометах и дульных гранатометах. Это вооружение станет полезным дополнением нашей армии, до тех пор, пока мы сможем найти нужных людей для их разработки и производства."  
 
 BUL_ww1_equipment_effort_3:0 "Развитие снаряжения III"
 BUL_ww1_equipment_effort_3_desc:0 "К нам прищло письмо от квартирмейстеров с требованием оснастить армию большим количеством винтовок, приспособленных для траншейной войны, а если говорить прямо, то: должна быть возможность установить на винтовку — прицел, штык, а также устройство для запуска винтовочных гранат. Конечно, мы можем просто увеличить производство всего по отдельности, но логическим шагом станет создание новых стандартов для винтовки, которые дожлны будут соответствовать всем этим требованиям."
 
 BUL_ww1_equipment_effort_4:0 "Развитие снаряжения IV"
 BUL_ww1_equipment_effort_4_desc:0 "К нашему несчастью, квартирмейстеры направили новый список требований. Мы проинструктировали почтальонов, чтобы они больше не доставляли нам их письма. Последнее требование квартирмейстеров — поставить новое снаряжение для инженерных войск: новые модели карабинов, инструменты и, возможно, ещё эти так называемые «огнемёты», которые мы постараемся отправить как можно скорее. Такое улучшение наших инженерных корпусов может принести пока неизвестные нам выгоды..."
 
 BUL_ww1_armor_effort_1:0 "Бронетехника"
 BUL_ww1_armor_effort_1_desc:0 "Наши предшествующие усилия не пропали даром! Конструкторы и инженеры артиллерии и автомашин предложили нам новый вид техники — тяжелобронированный трактор с орудием прямого наведения. Эти ранние проекты еще не приспособлены к боевым действиям, однако эта идея имеет большое будущее — она может наконец покончить с окопной войной, особенно если эти машины смогут выдерживать пулеметный огонь." 
 
 BUL_ww1_armor_effort_2:0 "Бронетехника II"
 BUL_ww1_armor_effort_2_desc:0 "Наши эксперименты с бронетехникой показывают все более многообещающие успехи! Однако, мы все равно недовольны существующими образцами. Инженеры предлагают нам множество идей таких как: вращающаяся башня, особые машинные отделения и особый люк для командира — и такие наработки мы не можем игнорировать. Если эти замыслы будут воплощены в жизнь, то нас невозможно будет остановить!"
 
 BUL_ww1_gasmask_focus:0 "Химическая война"
 BUL_ww1_gasmask_focus_desc:0 "Некоторые химики предлагают нам использовать в качестве оружия смертельное вещество — ядовитый газ, который будет доставляться артиллерией и окопными минометами. Хотя использование химического оружия не одобрялось практически столетие, какой у нас есть выбор, если мы хотим выиграть эту войну? Кроме разработки собственного вооружения, необходимо быстро позаботиться и о контрмерах — будет глупо, если эта военная разработка обернется против нас!"
 #--------------------------------------------------------------
 
 
 # [Bulgaria] Industrial Effort
 #=========================================================================
 BUL_ww1_industrial_effort:0 "Развитие промышленности"
 BUL_ww1_industrial_effort_desc:0 "Эпоха господства промышленности находится в самом разгаре, и нам еще предстоит много работы. Создание новых проектов для увеличения нашего промышленного потенциала принесет нам неплохую выгоду, особенно в части производства снаряжения для наших военных." 
  
 BUL_ww1_construction_effort:0 "Развитие строительства"
 BUL_ww1_construction_effort_desc:0 "Одна из зарубежных фирм была поглощена нашим государственным предприятием. Если мы убедим их перенести производство и рабочие места в нашу страну, то это даст значительный рост сектору гражданской экономики. Конечно, со своей стороны мы обеспечим постройку всех необходимых сооружений..." 
  
 BUL_ww1_construction_effort_2:0 "Развитие строительства II"
 BUL_ww1_construction_effort_2_desc:0 "Иногда, даже в нерегулируемой рыночной экономике, государству приходится в нее вмешиваться. Если мы создадим новые государственные корпорации и обеспечим их заводами, то мы гарантируем, что наша страна сможет жить самодостаточно в то время, когда торговля будет затруднена."
  
 BUL_ww1_construction_effort_3:0 "Развитие строительства III"
 BUL_ww1_construction_effort_3_desc:0 "Расширение нашей гражданской промышленности почти закончено, однако у нас есть еще один замысел. Мы можем продать компаниям некоторые пригородные земли, при условии, что они будут использовать ее для постройки своих заводов. Это еще сильнее увеличит выпуск гражданской продукции, и у нас практически не осталось способов для роста производства, кроме обыденной постройки фабрик."
  
 BUL_ww1_production_effort:0 "Развитие вооружений"
 BUL_ww1_production_effort_desc:0 "Количество закупаемого нами вооружения привлекло внимание местного стального магната, который хотел бы организовать новую оружейную компанию в нашей стране. Если мы поддержим это начинание, найдя землю, инвесторов и хороших рабочих, то очень скоро мы ощутим все преимущества от существования военного завода." 
  
 BUL_ww1_production_effort_2:0 "Развитие вооружений II"
 BUL_ww1_production_effort_2_desc:0 "Автомобильный концерн, до этого прозводящий для нас армейскую технику, теперь хочет создать отдельный завод по производству военной продукции, чтобы за счет освободившихся линий увеличить производство гражданских автомобилей. Если мы заинтресованы в таком заводе, то возможно заключить эксклюзивный договор, который для нас обернется увеличением поставок военного оборудования."
  
 BUL_ww1_production_effort_3:0 "Развитие вооружений III"
 BUL_ww1_production_effort_3_desc:0 "Один из авиационных конструкторов попросил нас о помощи в создании нового завода по производству его авиатехники для наших ВВС. Хотя его модели не были протестированы, в худшем случае мы просто заставим завод производить технику выгодную нам. Профинансировав строительство и оказав ему помощь в создании своей компании, мы увеличим наши военный промышленный потенциал."    
  
 BUL_ww1_dockyard_effort_1:0 "Расширение верфей"
 BUL_ww1_dockyard_effort_1_desc:0 "Выкупив неиспользуемые прибрежные земли и расширив нашу существующую инфраструктуру, мы сможем увеличить наши производтсвенные сощности по выпуску кораблей." 
  
 BUL_ww1_dockyard_effort_2:0 "Расширение верфей II"
 BUL_ww1_dockyard_effort_2_desc:0 "Матросы с торговых флотилий, рыбаки и отставные моряки нашего флота могли бы использовать свой опыт, чтобы курировать производство на новых верфях."
  
 BUL_ww1_dockyard_effort_3:0 "Расширение верфей III"
 BUL_ww1_dockyard_effort_3_desc:0 "Некоторые коммерческие доки пришли в упадок, но если вложиться в их ремонт и модернизацию, то они могут быть легко перенаправлены на производство военных судов."
  
 BUL_ww1_airfield_expansion_1:0 "Расширение аэродромов"
 BUL_ww1_airfield_expansion_1_desc:0 "Для постройки аэродромов нужен лишь открытый участок земли, находящийся рядом с дорожной сетью. Создание самих полос и инфраструктуры это конечно, серьезная работа, но она точно окупится."
  
 BUL_ww1_airfield_expansion_2:0 "Расширение аэродромов II"
 BUL_ww1_airfield_expansion_2_desc:0 "Некоторые гражданские посадочные полосы заброшены,выкупив и восстановив их, мы легко сможем использовать их для наших целей."
  
 BUL_ww1_airfield_expansion_3:0 "Расширение аэродромов III"
 BUL_ww1_airfield_expansion_3_desc:0 "Построив полноценные аэродромы у больших городов, мы сможем создать сеть легко снабжаемых баз для наших самолётов, что позволит нам существенно лучше оборонять самые важные регионы." 
  
 BUL_ww1_infrastructure_effort:0 "Улучшение инфраструктуры"
 BUL_ww1_infrastructure_effort_desc:0 "По мере роста промышленности, частный сектор все чаще требует от нас инвестиций в инфраструктуру, что поможет росту экономики. Но если мы начнем заниматься этим делом, то у нас больше не будет ресурсов на строительство новых заводов. С другой стороны, именно инфрастраструктура будет влиять на скорость подвоза припасов и перемещения наших войск, так что может это и неплохая идея." 
  
 BUL_ww1_infrastructure_effort_2:0 "Улучшение инфраструктуры II"
 BUL_ww1_infrastructure_effort_2_desc:0 "Хотя у нас постоянно растет количество заводов, верфей и аэродромов, у нас еще есть возможности для новых вложений. Следующим логичным шагом станет развитие сети железных дорог, которые мы до сих пор упускали из виду. Проложение железнодорожных путей не только ускорит перемещение припасов и людской силы, но и откроет новые возможности для инвестиций в экономику."
  
 BUL_ww1_infrastructure_effort_3:0 "Улучшение инфраструктуры III"
 BUL_ww1_infrastructure_effort_3_desc:0 "Угроза приближающейся войны только подстегивает наши строительные работы. Мы должны убедиться, что у наших войск будут самые лучшие железнодорожные пути в мире!"
  
 BUL_ww1_infrastructure_effort_4:0 "Улучшение инфраструктуры IV"
 BUL_ww1_infrastructure_effort_4_desc:0 "Группа инженеров предложила нам провести многообещающую систему автомагистралей, которая соединит все крупные города и даже военные центры. Вложив деньги в этот проект, наша инфраструктура в будущем будет вызывать лишь зависть у всего мира! Все дороги должны вести в нашу столицу!" 
  
 BUL_ww1_extra_tech_slot:0 "Дополнительный слот для исследований"
 BUL_ww1_extra_tech_slot_desc:0 "Создание огромного промышленного потенциала, а также назначения наших лучших руководителей из НИОКР и военной сферы на новые предприятия, должны были рано или поздно принести плоды. Некоторые отрасли производства подарили нам выдающихся изобретателей, которые смогут создать новые технологии для нашей страны." 
  
 BUL_ww1_extra_tech_slot_2:0 "Дополнительный слот для исследований II"
 BUL_ww1_extra_tech_slot_2_desc:0 "Наши достижения в промышленности и создании инфраструктуры сделали нашу страну маленькой — не на карте, слава Богу — а в смысле сплоченности всего нашего народа. В столицу стали чаще приезжать новые умы из глубинки, и нам будет несложно убедить их работать на благо нашей нации."
 #--------------------------------------------------------------
 
 
 # [Bulgaria] Naval Effort
 #=========================================================================
 BUL_ww1_naval_effort:0 "Военно-морские силы Болгарии"
 BUL_ww1_naval_effort_desc:0 "Созданы 13 января 1899 года, когда Дунайская флотилия и Морская часть были объединены в военно-морской флот со штабом в городе Варна."
 
 BUL_ww1_newnavalcanons_1:0 "Развитие орудий флота"
 BUL_ww1_newnavalcanons_1_desc:0 "В то время как развитие новых образцов для флота идет своим чередом, мы не должны забывать и об орудиях, стоящих на наших кораблях. Хотя мы в течение века старались стандартизировать калибры наших пушек, у нас все равно осталось множество видов орудий для различных задач. Пришло время сократить этот список, таким образом, унифицировать все наши разработки."
 
 BUL_ww1_newnavalcanons_2:0 "Развитие орудий флота II"
 BUL_ww1_newnavalcanons_2_desc:0 "Мы решили проблему с разнообразием калибров, однако мы должны также обеспечивать поставки оборудования, которое может помочь корабельным артиллеристам при ведении боя. Поставки дальномеров, которые скоро станут распостраненным прибором на наших кораблях, а также обучение офицеров по их использованию с учетом дальности стрельбы орудия, сделают использование наших новейших орудий более эффективным."
 
 BUL_ww1_newnavalcanons_3:0 "Развитие орудий флота III"
 BUL_ww1_newnavalcanons_3_desc:0 "Корабельная система управления огнем вызвала бурю обсуждений в морском сообществе, благодаря ее способности обеспечить наведение пушек судна на одну и ту же цель. Пусть она и примитивная, но корабли, поддерживающие использование такой системы, пользуются все большей популярностью. Эти новые проекты поставят нас на вершину морского технологического прогресса." 
 
 BUL_ww1_dreadnought_effort:0 "Модернизация дредноутов"
 BUL_ww1_dreadnought_effort_desc:0 "С тех пор как Великобритания открыла всем нам новый класс кораблей — дредноуты, между всеми ведущими державами началась гонка за создание самого большого и эффективного судна такого класса. Чтобы наш флот соответствовал требованиям современной войны, мы обязаны начать проектирование улучшенных моделей дредноутов."
 
 BUL_ww1_flexible_navy:0 "Гибкость военно-морского флота"
 BUL_ww1_flexible_navy_desc:0 "Даже необъятная масса кораблей будет бесполезна, если она будет патрулировать небольшую территорию в океане. Строительство флота, состоящего из небольшого количества линкоров и дредноутов, и поддерживаемого большим количеством кораблей прикрытия, поможет нам контролировать любую морскую зону и отвечать на угрозы наших соперников."
 
 BUL_ww1_large_navy:0 "Большой военно-морской флот"
 BUL_ww1_large_navy_desc:0 "Линкоры и дредноуты — сама по себе грозная сила, но дополнив их значительным количеством крейсеров и кораблей сопровождения, мы обеспечим не только тактические преимущества, но и увеличим абсолютное число судов нашего флота. Создав и развив доктрину вокруг этой идеи, наш флот станет непобедимым."
 
 BUL_ww1_navyreform:0 "Реформы военно-морского флота"
 BUL_ww1_navyreform_desc:0 "Морские сражения выигрывают не только орудия и корабли. Даже самое лучшее судно будет бесполезно, если оно не окажется в нужное время в нужном месте. Вложения в развитую систему коммуникаций между судами и портами гарантирует нам, что нужные корабли окажутся в необходимом месте в точное время, а это только упрочит наше морское превосходство." 
 
 BUL_ww1_submarine_effort:0 "Усиление подводных лодок"
 BUL_ww1_submarine_effort_desc:0 "Подводная лодка — класс кораблей, способных погружаться и длительное время действовать в подводном положении. До 1944 года все подлодки большую часть времени проводили в надводном положении и по сути были погружающимися лодками — надводными кораблями, способными погружаться под воду для атаки в светлое время суток или для скрытия от вражеских кораблей."
 
 BUL_ww1_cruiser_effort:0 "Модернизация крейсеров"
 BUL_ww1_cruiser_effort_desc:0 "Крейсер — класс боевых надводных кораблей, способных выполнять задачи независимо от основного флота, среди которых может быть борьба с лёгкими силами флота и торговыми судами противника, оборона соединений боевых кораблей и конвоев судов, огневая поддержка приморских флангов сухопутных войск и обеспечение высадки морских десантов, постановка минных заграждений и другие."
 
 BUL_ww1_destroyer_effort:0 "Модернизация эсминцев"
 BUL_ww1_destroyer_effort_desc:0 "Эскадренный миноносец — класс многоцелевых боевых быстроходных маневренных кораблей, предназначенных для борьбы с подводными лодками, и кораблями противника, а также для охраны и обороны соединений кораблей или конвоев судов при переходе морем. Эскадренные миноносцы могут также использоваться для разведывательной и дозорной службы, артиллерийской поддержки при высадке десанта и для постановки минных заграждений, а также дымовых завес."
 
 BUL_ww1_capital_ships_effort:0 "Модернизация флота"
 BUL_ww1_capital_ships_effort_desc:0 "Наш флот устарел и нуждается в немедленной модернизации. Модернизация флота даст нам преимущество."
 
 BUL_ww1_carrier_focus:0 "Создание авианесущих кораблей"
 BUL_ww1_carrier_focus_desc:0 "Некоторые передовые конструкторы предложили нам проект практически безоружного корабля, предназначенного для размещения крыла морских бомбардировщиков. Это многообещающий замысел, даже если он трудновыполним с учетом нынешнего развития технологий. Возможно, массовое участие самолётов скоро станет обыденным явлением в морской войне."
 
 BUL_ww1_antisubmarine:0 "Оборона против подводных лодок"
 BUL_ww1_antisubmarine_desc:0 "Подводные лодки тяжело обнаружить, особенно когда ими командует опытный офицер. Если мы не хотим, чтобы все наши грузы оказались на дне моря, то надо подсказать адмиралам, что пора бы уже изучить применение глубинных бомб, продвинутых торпед, и других средств для борьбы с этой заразой."
