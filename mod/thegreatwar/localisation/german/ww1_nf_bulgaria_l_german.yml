l_german:
###  Übersetzung von Proho  ###
 # [Bulgarien] Armeeeinsatz
 #=========================================================================
 BUL_ww1_army_effort: "Bulgarische Landstreitkräfte reorganisieren"
 BUL_ww1_army_effort_desc: "Es ist weniger als ein Jahrzehnt her, dass Bulgarien seine Unabhängigkeit hart erkämpft hat. Es gibt viel zu tun, in allen Bereichen, in allen Regionen, aber es gibt Prioritäten, die wichtiger sind als andere ... und die Armee muss unbedingt gestärkt werden, damit unsere junge Nation die kommenden Zeiten überstehen kann. Wir müssen eine Sonderkommission einberufen und über die Organisation unserer Streitkräfte entscheiden."
 BUL_ww1_trenchwarfare: "Schwerpunkt Grabenkämpfe"
 BUL_ww1_trenchwarfare_desc: "Seit Gatling und Maxim ihre gottlosen Kriegswaffen vorgestellt haben, ist unsere Nation stark an Strategien interessiert, die auf der Verteidigung von Grabenlinien basieren, die zuerst im Bürgerkrieg zu sehen waren. Wir müssen nach Experten für diese Theorie suchen - sowohl Feld- als auch Armchair-Generäle -, um unser Wissen über die Bodendoktrinen der Zukunft voranzutreiben."
 BUL_ww1_artillery_effort_1: "Artillerie Einsatz I"
 BUL_ww1_artillery_effort_1_desc: "Ein Schritt zur Entwicklung unseres jungen Programms zur Modernisierung des Militärs ist die Entwicklung unserer Artilleriebatterien. Die Suche nach Designern für neue Waffen ist ein logischer erster Schritt, und sobald unser Projekt abgeschlossen ist, planen wir, die Vorteile einer neuen, leicht vorstellbaren Artillerie zu nutzen."
 BUL_ww1_artillery_effort_2: "Artillerie Einsatz II"
 BUL_ww1_artillery_effort_2_desc: "Nachdem wir nun einige versierte Artilleriedesigner zusammengebracht haben, erscheint es logisch, ihre Bemühungen mit unseren Fabriken zu unterstützen. Indem wir diese Männer als Vollzeit-Designer und -Ingenieure zuweisen, können wir leicht Fortschritte im Bereich der Artillerie erzielen."
 BUL_ww1_artillery_effort_3: "Artillerie Einsatz III"
 BUL_ww1_artillery_effort_3_desc: "Feldversuche zeigen ein großes Problem mit unseren Artilleriegeschützen: Die große Vielfalt an Kalibern, die wir für verschiedene Artilleriemodelle verwenden, erweist sich als teurer Aufwand und verringert die Effektivität unserer Kanonen im Feld. Indem wir einige Standardgrößen für unsere Geschütze vorschreiben, können wir neue Artilleriemodelle herstellen, die uns buchstäblich mehr Munition für unser Geld bieten."
 BUL_ww1_artillery_effort_4: "Artillerie Einsatz IV"
 BUL_ww1_artillery_effort_4_desc: "Obwohl man glaubte, dass die Feldkanone mit Direktbeschuss vom Schlachtfeld verschwinden würde, fordern unsere Quartiermeister immer mehr dieser leichten Geschütze an, anstatt nur mehr Haubitzen und Belagerungsgeschütze zu verlangen. Die Konzentration unserer Bemühungen auf neue Direktfeuer-Geschütze und vielleicht mehr Geschosse zum Ausgleich werden nicht nur unweigerlich zu besseren Modellen führen, sondern vielleicht auch zu einigen unerwarteten Vorteilen in anderen Bereichen..."
 BUL_ww1_special_forces: "Schwerpunkt Spezialkräfte"
 BUL_ww1_special_forces_desc: "Mit all ihrem Schrecken hat die chemische Kriegsführung durch puren Zufall unglaublich disziplinierte Einheiten mit einer blitzschnellen Reaktionszeit initiiert, die anderen Gruppen unserer Armee überlegen ist. Diese Männer scheinen sehr nützlich zu sein, um als Marine-Truppen, Alpenjäger und andere spezielle Einheiten zu agieren, die über dem Standardgewehr stehen. Die Suche nach Männern und guten Offizieren könnte zu effektiveren Spezialeinheiten führen. Wenn es doch nur einen Weg gäbe, wie sie schneller in die Schlacht kommen könnten, wie die Kavallerie in früheren Zeiten ..."
 BUL_ww1_army_motorization_focus: "Schwerpunkt Motorisierung"
 BUL_ww1_army_motorization_focus_desc: "Einige unserer Genies im Generalstab - oder vielleicht auch nur Männer, die von der Sackgasse des Grabenkriegs gesättigt sind - haben die Massenproduktion von speziellen Fahrzeugen für den Truppentransport vorgeschlagen, die es unseren Männern ermöglichen würden, schneller auf die Schlachtfelder - und vielleicht auch um sie herum - zu gelangen. Natürlich erfordert selbst dieser einfache Akt eine spezielle Ausrüstung und Ausbildung, was eine Investition bedeutet - obwohl sie leicht bezahlt werden könnte."
 BUL_ww1_doctrine_effort: "Doktrin Einsatz I"
 BUL_ww1_doctrine_effort_desc: "Obwohl die Zeiten, in denen der Generalstab aus den Prinzen des Königreichs bestand, schon lange vorbei sind, wurden viele unserer Generäle und hohen Offiziere nicht aufgrund ihrer Fähigkeiten, sondern aufgrund familiärer Beziehungen oder Bindungen für unsere Armeen ausgewählt.  Obwohl sie dadurch loyal bleiben, beginnen andere Nationen mit ihren eigenen hochrangigen Militärs ernsthafter und wettbewerbsfähiger zu werden. Wir müssen mit der Ernennung nach Verdienst beginnen, aber noch hoffen wir, dass wir nicht zu viel Gesindel in den Generalstab lassen..."
 BUL_ww1_doctrine_effort_2: "Doktrin Einsatz II"
 BUL_ww1_doctrine_effort_2_desc: "Obwohl unser Generalstab nun vollständig auf Verdiensten beruht, sind sie vielleicht nicht die einzigen, die bei unseren Militärdoktrinen helfen können. Eine Klasse von Männern, die seit den frühen 1800er Jahren im Dornröschenschlaf lagen - Militärtheoretiker - beginnt wieder einmal aufzutauchen. Obwohl viele dieser Männer nur über begrenzte Kampferfahrung verfügen, kann ihr Studium in Kriegszeiten nicht ignoriert werden. Ihre Einbeziehung könnte sich als vorteilhaft für unsere Militärtaktiken erweisen."
 BUL_ww1_doctrine_effort_3: "Doktrin Einsatz III"
 BUL_ww1_doctrine_effort_3_desc: "Eines der wichtigsten Elemente des Krieges wurde bislang weitgehend ignoriert: die Logistik. Bei einer so hohen Konzentration von Truppen im Kampf müssen wir sicherstellen, dass sie rechtzeitig ankommen und zumindest Nahrung, Wasser und eine Waffe dabei haben. Eine Stimme für Experten in dieser Frage und mehr Training für Fahrzeugführer würden unmittelbare Vorteile für unsere Doktrin bringen, aber vielleicht auch andere Vorteile in der Zukunft."
 BUL_ww1_equipment_effort: "Ausrüstung Einsatz I"
 BUL_ww1_equipment_effort_desc: "Unsere Generäle sind nicht die einzige alte Garde, die unser Militär im letzten Jahrhundert hält. Unsere Quartiermeister haben immer noch einige der militärischen Probleme des 19. Jahrhunderts hinter sich, wie Korruption und Abwesenheit. Durch die Auswahl der beliebtesten und erfahrensten Offiziere können wir vor allem die Fehler unserer aktuellen Waffen kennenlernen, so dass wir schneller korrigierte und verbesserte Entwürfe produzieren können - und außerdem sicherstellen, dass diese Männer nicht zu beliebt werden!"
 BUL_ww1_equipment_effort_2: "Ausrüstung Einsatz II"
 BUL_ww1_equipment_effort_2_desc: "Unsere neuen Intendanten baten uns nicht einfach nur um neuere Gewehre, sondern auch um neue Unterstützungswaffen. Die Erfahrung mit diesem neuen Armeemodell hat zu Ideen wie leichten Maschinengewehren, Grabenmörsern und Gewehrgranaten geführt, die durchaus nützlich erscheinen, vorausgesetzt, wir bekommen die richtigen Leute für ihre Entwicklung und Herstellung."
 BUL_ww1_equipment_effort_3: "Ausrüstung Einsatz III"
 BUL_ww1_equipment_effort_3_desc: "Die Stewards schickten einen Brief mit Forderungen nach Gewehren, die für Schützengrabenbedingungen ausgerüstet sind- solche, die Gewehrgranaten abfeuern, Bajonette oder Brillen anbringen und mehr Karabiner. Obwohl wir einfach mehr produzieren könnten, scheint es logisch zu sein, unsere Gewehre auf den Standard zu bringen, dass sie all diese Dinge können - was ein neues, verbessertes Design bedeutet."
 BUL_ww1_equipment_effort_4: "Ausrüstung Einsatz IV"
 BUL_ww1_equipment_effort_4_desc: "Leider haben uns unsere Intendanten eine weitere Liste mit Forderungen geschickt. Glücklicherweise haben wir unsere Postmeister angewiesen, weitere Post von ihnen zu ignorieren. Ihre neueste Forderung ist eine neue Ausrüstung für unsere Pioniertruppen - neue Modelle von Gewehren, neue Werkzeuge und vielleicht neue Flammenwerfer, die so bald wie möglich in Dienst gestellt werden sollen. Natürlich könnte die Erweiterung des Pionierkorps unsichtbare Vorteile bringen..."
 BUL_ww1_armor_effort_1: "Panzerentwicklung I"
 BUL_ww1_armor_effort_1_desc: "Unsere bisherigen Investitionen haben sich ausgezahlt! Artilleriedesigner, Ingenieure und Fahrzeugdesigner haben uns einen völlig neuen Fahrzeugtyp vorgeschlagen - einen schwer gepanzerten Traktor mit einer direkt feuernden Kanone.  Obwohl diese frühen Entwürfe eindeutig nicht kampftauglich sind, ist das Konzept sehr vielversprechend - vor allem, um die Sackgasse der Schützengräben zu beenden, wenn diese Fahrzeuge dem Maschinengewehrfeuer standhalten können, wie behauptet wird."
 BUL_ww1_armor_effort_2: "Panzerentwicklung II"
 BUL_ww1_armor_effort_2_desc: "Unsere Erfahrungen mit gepanzerten Fahrzeugen waren ein Erfolg! Wir können uns jedoch nicht auf unseren Lorbeeren ausruhen. Die Ingenieure haben interessante Konzepte wie drehbare Türme, spezielle Motorräume und eine Luke für den Kommandanten vorgeschlagen, die nicht ignoriert werden können. Wenn wir die Ersten sein wollen, die diese Ideen in die Tat umsetzen, können wir vielleicht unwiderstehlich werden!"
 BUL_ww1_gasmask_focus: "Schwerpunkt Chemische Kriegsführung"
 BUL_ww1_gasmask_focus_desc: "Einige unserer Chemiker schlugen den Einsatz eines neuen Gases vor - unglaublich giftig, das von unserer Artillerie und den Mörsern in den Schützengräben abgefeuert wurde. Obwohl die chemische Kriegsführung in diesem Jahrhundert missbilligt wurde, welche Wahl haben wir, wenn wir den Krieg gewinnen müssen? Neben der Investition in diese Waffen ist es auch wahrscheinlich, dass wir schnell Gegenmaßnahmen entwickeln - es wäre bedauerlich, wenn sich ein solcher Fortschritt gegen uns wenden würde!"
 #--------------------------------------------------------------
 # [Bulgarien] Industrieentwicklung
 #=========================================================================
 BUL_ww1_industrial_effort: "Industrieentwicklung"
 BUL_ww1_industrial_effort_desc: "Die Stärkung unserer Industrie ist unerlässlich, um die Herausforderungen des 20. Jahrhunderts zu meistern. Ein paar neue, ehrgeizige Projekte zur Steigerung unserer industriellen Fähigkeiten in Angriff zu nehmen, würde unserer Nation kurz- und langfristige Vorteile bringen, und das geringste davon wäre eine große Verbesserung unserer Fähigkeit, unsere Truppen zu bewaffnen."
 BUL_ww1_construction_effort: "Bau Anstrengung I"
 BUL_ww1_construction_effort_desc: "Ein ausländisches Unternehmen aus einer benachbarten neutralen Nation ist mit einer unserer nationalen Industrien fusioniert worden. Wenn wir die neue Tochtergesellschaft dazu ermutigen, ihre Fabriken und Arbeitsplätze in unser Land zu verlegen, werden wir einen sofortigen Anstieg unserer zivilen Industrie erleben. Natürlich sollten wir den Bau dieser neuen Fabriken beaufsichtigen..."
 BUL_ww1_construction_effort_2: "Bau Anstrengung II"
 BUL_ww1_construction_effort_2_desc: "Manchmal muss sich der Staat sogar in einem Freihandelsmarkt einmischen. Wenn der Staat die Gründung neuer Unternehmen finanzieren muss, müssen wir dafür sorgen, dass wir wettbewerbsfähig und unabhängig von ausländischen Importen bleiben, falls der Handel schwieriger werden könnte."
 BUL_ww1_construction_effort_3: "Bau Anstrengung III"
 BUL_ww1_construction_effort_3_desc: "Unsere zivile industrielle Expansion ist fast abgeschlossen, aber es gibt immer noch einiges zu tun. Einige Grundstücke, die wir in einer Stadt besitzen, können immer noch an einen unserer Konzerne verkauft werden, mit dessen Zustimmung sie dort eine Manufaktur errichten können. Dies wird unsere zivile Warenproduktion weiter erhöhen und uns mehr Optionen für zukünftige Bauten geben."
 BUL_ww1_production_effort: "Rüstungsanstrengungen I"
 BUL_ww1_production_effort_desc: "Die Menge an Waffen, die wir erworben haben, hat das Interesse eines örtlichen Stahlfabrikanten geweckt, der in unserem Land eine neue Waffenfabrik errichten möchte. Wenn wir diese Bemühungen unterstützen, indem wir ihm helfen, das nötige Land zu erwerben und ihm Investoren und Talente zur Verfügung stellen, werden wir mehr als nur den Gewinn einer neuen Rüstungsfabrik erhalten."
 BUL_ww1_production_effort_2: "Rüstungsanstrengungen II"
 BUL_ww1_production_effort_2_desc: "Ein Automobilunternehmen, das in der Vergangenheit Fahrzeuge der Militärklasse für uns gebaut hat, hat Interesse daran bekundet, eine völlig neue Fabrik speziell für die Militärproduktion zu errichten, um seine Produktionskapazitäten für den zivilen Markt zu erhalten. Wenn wir ihnen beim Bau dieser Fabrik helfen, könnten wir einen Exklusivvertrag aushandeln, was eine direkte Erhöhung unserer militärischen Produktionskapazität bedeuten würde."
 BUL_ww1_production_effort_3: "Rüstungsanstrengungen III"
 BUL_ww1_production_effort_3_desc: "Ein Flugzeugkonstrukteur und ein Mechaniker kamen mit einer neuen Anfrage zu uns, um eine Militärflugzeugfabrik zu gründen, in der Flugzeuge für unsere Armeen zusammengebaut werden sollten."
 BUL_ww1_dockyard_effort_1: "Werftenausbau I"
 BUL_ww1_dockyard_effort_1_desc: "Durch den Kauf von ungenutztem oder verlassenem Küstenland zum Ausbau unserer bestehenden Infrastruktur könnten wir unsere Arsenale und Werften vergrößern."
 BUL_ww1_dockyard_effort_2: "Werftenausbau II"
 BUL_ww1_dockyard_effort_2_desc: "Matrosen der Handelsmarine, Fischer und pensionierte Seeleute unserer eigenen Marine können ihr Talent und ihre Erfahrung auf See nutzen, um an unseren neuen Docks zu arbeiten und sie zu beaufsichtigen."
 BUL_ww1_dockyard_effort_3: "Werftenausbau III"
 BUL_ww1_dockyard_effort_3_desc: "Einige unserer alten Häfen an der Schwarzmeerküste werden heutzutage nicht mehr viel genutzt. Mit ein paar Investitionen und Renovierungsarbeiten könnten diese leicht für militärische Zwecke umgebaut werden."
 BUL_ww1_airfield_expansion_1: "Flugplatz Ausbau I"
 BUL_ww1_airfield_expansion_1_desc: "Flugplätze haben den Luxus, dass sie nur ein Stück Land benötigen, das relativ nah an einem Straßennetz liegt. Die Einrichtung eines solchen Geländes ist eine Arbeit für sich, die sich jedoch auszahlen wird."
 BUL_ww1_airfield_expansion_2: "Flugplatz Ausbau II"
 BUL_ww1_airfield_expansion_2_desc: "Einige unserer zivilen Landebahnen aus den Tagen vor der Militärluftfahrt sind noch da und jetzt verlassen. Wir können sie für einen Brotpreis zurückkaufen und für unsere eigenen Zwecke nutzen."
 BUL_ww1_airfield_expansion_3: "Flugplatz Ausbau III"
 BUL_ww1_airfield_expansion_3_desc: "Die Einrichtung geeigneter Flugplätze in der Nähe größerer städtischer Zentren kann uns die Schaffung einfacher Versorgungsbasen ermöglichen, die in der Lage sind, unsere wertvollen Bereiche zu schützen."
 BUL_ww1_infrastructure_effort: "Infrastruktur Bemühungen I"
 BUL_ww1_infrastructure_effort_desc: "Mit dem Wachstum unserer Industrie fordert der Privatsektor weiterhin, die Investitionen in die Infrastruktur zu erhöhen, um die nationale Wirtschaft zu unterstützen. Solange wir das tun, werden wir nicht mehr Möglichkeiten erhalten, neue Fabriken zu errichten. Natürlich hilft die Infrastruktur auch unserer Nation, indem sie die Geschwindigkeit und den Versorgungsfluss für unsere Truppen erhöht, daher könnte diese Investition kein so schlechter Plan sein."
 BUL_ww1_infrastructure_effort_2: "Infrastruktur Bemühungen II"
 BUL_ww1_infrastructure_effort_2_desc: "Mit unseren Industriebetrieben, Werften und Landebahnen, die immer weiter ausgebaut werden, gibt es immer mehr zu investieren. Derzeit liegt der logische Schritt nach vorn bei den Eisenbahnen, die wir bislang weitgehend ignoriert haben. Investitionen in deren Modernisierung werden dazu beitragen, Vorräte und Menschen zu bewegen und neue Gebiete für Investitionen in unsere Wirtschaft zu erschließen."
 BUL_ww1_infrastructure_effort_3: "Infrastruktur Bemühungen III"
 BUL_ww1_infrastructure_effort_3_desc: "Da ein großer Krieg droht, müssen wir weiterhin in Bauprojekte investieren und dafür sorgen, dass unsere Truppen die angenehmsten Eisenbahnen der Welt haben."
 BUL_ww1_infrastructure_effort_4: "Infrastruktur Bemühungen IV"
 BUL_ww1_infrastructure_effort_4_desc: "Einige Bauingenieure haben die Schaffung eines der ehrgeizigsten Straßennetzes vorgeschlagen, das unsere größten Städte und einige unserer Militärstützpunkte miteinander verbinden soll. Die Investition in dieses Projekt wird unsere Infrastruktur zu einem Objekt der Begierde für die ganze Welt machen, alle Straßen werden zu unserer Hauptstadt führen!"
 BUL_ww1_extra_tech_slot: "Extra Forschungsslot I"
 BUL_ww1_extra_tech_slot_desc: "Mit einem so großen Industriesektor und mehreren unserer klügsten Köpfe an den Schalthebeln der Militärmanufakturen und der militärischen Entwicklung sind schnell Ergebnisse zu erwarten. Einige der Industrien, die wir anfangs unterstützt haben, haben einige leidenschaftliche Individuen hervorgebracht, die interessante Forschungen für unsere Nation durchführen können."
 BUL_ww1_extra_tech_slot_2: "Extra Forschungsslot II"
 BUL_ww1_extra_tech_slot_2_desc: "Unsere großen Investitionen in Industrie und Infrastruktur haben unser Land - leider nicht auf der Landkarte - kleiner gemacht. Einige kluge Köpfe aus den dunkleren Teilen unseres Landes besuchen die Hauptstadt häufiger, und es wäre nicht besonders schwierig, sie in den Dienst der Nation zu integrieren."
 #--------------------------------------------------------------
 # [Bulgarien] Marine Einsatz
 #=========================================================================
 BUL_ww1_naval_effort: "Bulgarische Marine verstärken"
 BUL_ww1_naval_effort_desc: "Unsere Marine hat nur Zugang zum Schwarzen Meer und muss daher in der Lage sein, mit der griechischen und vor allem der osmanischen Marine zu konkurrieren, um unserer Macht Geltung zu verschaffen. Wir müssen neue Mittel bereitstellen, um unsere Infrastruktur zu erhalten und neue Schiffe in Auftrag zu geben."
 BUL_ww1_newnavalcanons_1: "Marinegeschütze I"
 BUL_ww1_newnavalcanons_1_desc: "Während sich das Design unserer Schiffe ständig weiterentwickelt, sollten wir die Marineartillerie an Bord unserer Schiffe nicht vergessen. Obwohl wir die Kaliber seit über einem Jahrhundert standardisiert haben, haben wir immer noch zu viele verschiedene Kaliber für zu viele verschiedene Rollen. Indem wir die Anzahl der Standards reduzieren und jede Waffenart universeller machen, können wir das Design von Schiffen rationalisieren."
 BUL_ww1_newnavalcanons_2: "Marinegeschütze II"
 BUL_ww1_newnavalcanons_2_desc: "Obwohl wir das Problem der Kanonen nun gelöst haben, sollten wir uns nun auf die Ausrüstung zur Unterstützung dieser Schiffsbatterien konzentrieren. Entfernungsmesser werden allmählich zum Standard auf unseren Schiffen. Die Gewissheit, dass unsere Offiziere damit umgehen können, vor allem bei maximaler Einsatzdistanz, wird es uns ermöglichen, unser Artilleriepotenzial voll auszuschöpfen."
 BUL_ww1_newnavalcanons_3: "Marinegeschütze III"
 BUL_ww1_newnavalcanons_3_desc: "Die Analoge Feuerkontrolle ist ein Meilenstein in der Schifffahrt, da sie alle Teile eines Schiffes auf das gleiche Ziel ausrichten kann. Obwohl es sich um ein relativ primitives Gerät handelt, ist es bereits sehr gefragt. Diese neuen Konstruktionen können uns einen entscheidenden Vorteil auf See verschaffen."
 BUL_ww1_dreadnought_effort: "Dreadnought Einsatz"
 BUL_ww1_dreadnought_effort_desc: "Seitdem die Briten die erste Schlachtschiffklasse enthüllt haben, ist zwischen den größten Marinen der Welt ein Wettrüsten ausgebrochen, um immer größere und mächtigere Schlachtschiffe zu bauen. Wenn unser Land mit der Zeit gehen will, müssen auch wir unsere Designs verbessern und unsere eigenen Dreadnoughts herstellen."
 BUL_ww1_flexible_navy: "Flexible Marine"
 BUL_ww1_flexible_navy_desc: "Eine große Masse an Kriegsschiffen ist für uns völlig nutzlos, wenn wir sie nur zur Patrouillenfahrt auf einem kleinen Quadrat des Meeres einsetzen. Wir müssen eine Flotte aufbauen, die sich überall und jederzeit bewegen kann, mit einer ausreichenden Anzahl von Abschirmschiffen, die von einer Reihe von Schlachtkreuzern und Schlachtschiffen unterstützt werden. Dies wird uns helfen, die Meere zu kontrollieren und auf eine Vielzahl von Bedrohungen zu reagieren, indem wir unsere Streitkräfte an fast jeden Ort der Welt projizieren können."
 BUL_ww1_large_navy: "Große Marine"
 BUL_ww1_large_navy_desc: "Linienschiffe und Schlachtschiffe zu haben, ist an sich schon eine gute Sache, aber ein Herz aus Panzerschiffen und Panzerkreuzern zu schaffen, kann leicht den Ausschlag zu unseren Gunsten geben und uns alle taktischen Optionen eröffnen, die diese Rollen zulassen, solange sie in der richtigen Anzahl vorhanden sind. Wenn wir unsere Marine um dieses Konzept herum aufbauen und die entsprechende Doktrin studieren, wird unsere Flotte schlichtweg unschlagbar sein."
 BUL_ww1_navyreform: "Marineeinsatz"
 BUL_ww1_navyreform_desc: "Es sind nicht einfach nur Kanonen und Schiffe, mit denen man eine Seeschlacht gewinnen kann. Das beste Schiff der Welt ist nutzlos, wenn es nicht zur richtigen Zeit am richtigen Ort ist. Investitionen in direkte Kommunikationskanäle zwischen Schiffen sowie zwischen der Flotte und dem Hafen können sicherstellen, dass jedes Schiff zur richtigen Zeit am richtigen Ort ist, und unsere Seeherrschaft unterstützen."
 BUL_ww1_submarine_effort: "U-Boot Einsatz"
 BUL_ww1_submarine_effort_desc: "U-Boote sind billig, können in großer Zahl eingesetzt werden und können eine furchterregende materielle und psychologische Bedrohung verursachen! Wir müssen einen Teil des Marinebudgets für den Bau mehrerer dieser neuen Maschinen bereitstellen."
 BUL_ww1_cruiser_effort: "Kreuzer Einsatz"
 BUL_ww1_cruiser_effort_desc: "Unsere Admiräle fordern eine größere Flotte und eine große Investition in Kreuzer, um uns mittelgroße Schiffe zu verschaffen, die feindliche Schiffe und Transporter belästigen und größere Kriegsschiffe unterstützen können. Unsere Konstruktionsbüros in die Lage zu versetzen, neue Schiffsklassen dieser Art zu entwerfen und zu bauen, wird uns gegen jeden Feind mit einer großen Flotte helfen und unsere Unterseeboote sichern."
 BUL_ww1_destroyer_effort: "Zerstörer Einsatz"
 BUL_ww1_destroyer_effort_desc: "Unsere Admiräle haben den Ausbau unserer Zerstörerflotte und größere Investitionen in diesem Bereich gefordert. Dies wird uns leichtere Schiffe bescheren, die gut für den Kampf gegen feindliche Tauchboote, die Aufklärung und die Begleitung von Konvois sind. Die Bestellung von besseren Torpedobooten bei unseren Werften wird uns helfen, unsere Handelsrouten offen zu halten und unsere eigenen U-Boote zu unterstützen."
 BUL_ww1_capital_ships_effort: "Groß-Schiff Einsatz"
 BUL_ww1_capital_ships_effort_desc: "Unsere Admiräle haben uns eine relativ einfache Bitte geschickt: Mehr Schlachtschiffe, und zwar größere und mächtigere! Der Bau dieser titanischen Schiffe wird uns helfen, die Meere zu kontrollieren, und ermöglicht uns eine gute Feuerunterstützung für unsere Bodentruppen, die im Falle einer Seeinvasion an Land gehen."
 BUL_ww1_carrier_focus: "Träger Einsatz"
 BUL_ww1_carrier_focus_desc: "Einige radikale Köpfe haben ein unbewaffnetes Schiff vorgeschlagen, das nur für den Einsatz von Marinebombern ausgerüstet ist, die von dort aus starten und weit draußen auf dem Meer zuschlagen sollen. Das ist ein sehr vielversprechendes Projekt, auch wenn es durch die heutige Technologie ein wenig behindert wird. Wenn wir unsere Bemühungen in diesem Projekt fortsetzen, wird die Marinefliegerei vielleicht eines Tages Allgemeingut werden..."
 BUL_ww1_antisubmarine: "U-Boot-Bekämpfung"
 BUL_ww1_antisubmarine_desc: "U-Boote sind besonders schwer zu fassende Schiffe, vor allem, wenn sie gut gesteuert werden. Sofern wir nicht vorhaben, unsere gesamte Transport- und Handelsflotte auf den Grund schicken zu lassen, haben uns unsere Admiräle geraten, mit Investitionen in Wasserbomben, fortschrittliche Torpedos und andere Waffen zu beginnen, mit denen wir die Bedrohung aus der Welt schaffen können."
 #--------------------------------------------------------------
 # [Bulgarien] Diplomatischer Einsatz
 #=========================================================================
 BUL_ww1_diplomatic_effort: "Diplomatischer Einsatz"
 BUL_ww1_diplomatic_effort_desc: "In der heutigen Welt wird es immer schwieriger, neutral zu bleiben. Unser diplomatisches Korps drängt uns immer wieder, in den sich entwickelnden Machtkämpfen Stellung zu beziehen oder unsere Neutralität offiziell zu erklären. Wir können die Frage noch nicht beantworten, aber wir können unseren Diplomaten leicht die Mittel an die Hand geben, um eine dieser Optionen zu wählen."
 BUL_ww1_Pacifism: "Pazifismus"
 BUL_ww1_Pacifism_desc: "Müssen wir heute noch aufzeigen, welche sinnlosen Zerstörungen und welche sinnlose Ressourcenverschwendung Kriege verursachen? Wir müssen unser diplomatisches Korps dazu bringen, an der friedlichen Beilegung von Konflikten zu arbeiten. Immer mehr Töten wird uns nicht weiterbringen und nur zu immer mehr Hass und Revanchismus führen."
 BUL_ww1_supportrussia: "Unterstützung Russlands"
 BUL_ww1_supportrussia_desc: "Russland ist seit Jahrhunderten ein natürlicher Gegner des Osmanischen Reichs, und obwohl auch sie ein Raubtier sind, das uns in gewisser Weise bedroht, müssen wir uns um das Nötigste kümmern. Unterstützen wir die Russen, denn sie sind unser wertvollster Verbündeter gegen die Türken im Süden."
 BUL_ww1_military_reserve: "Militärische Reserve"
 BUL_ww1_military_reserve_desc: "Durch den Aufbau einer militärischen Reserve, die innerhalb weniger Tage mobilisiert werden kann, können Verluste nach den ersten Kämpfen schnell ausgeglichen werden, und es kann sofort mit der Bildung neuer großer Einheiten begonnen werden."
 BUL_ww1_RecognizeAlbania: "Souveränität Albaniens anerkennen"
 BUL_ww1_RecognizeAlbania_desc: "Um zur allgemeinen Beruhigung beizutragen und unsere Beziehungen zu befrieden, sollten wir eine offizielle Erklärung abgeben und die Souveränität Albaniens über sein Volk und sein Territorium anerkennen. Sie werden es zweifellos zu schätzen wissen."
 BUL_ww1_ReleaseAlbania: "Albanien befreien"
 BUL_ww1_ReleaseAlbania_desc: "Die Albaner sind ausländischen Interessen unterworfen! Wir müssen sofort eingreifen. Zwischen unseren Grenzen liegen nur 160 Kilometer, und wir können innerhalb weniger Tage Einheiten mobilisieren, die nach Albanien einmarschieren und einen großen Teil des Landes sichern könnten."
 BUL_ww1_war_effort: "Kriegseinsatz"
 BUL_ww1_war_effort_desc: "Im gegenwärtigen Zustand der Welt können wir es uns nicht leisten, dass andere Nationen uns militärisch überholen. Durch den Ausbau unserer industriellen Kapazitäten sind wir sicher, dass wir genügend Waffen und Munition herstellen können, um aus der Masse herauszustechen."
 BUL_ww1_anti_auh: "Anti-Österreich-Ungarn-Politik"
 BUL_ww1_anti_auh_desc: "Die Österreicher richten ihre gesamte Politik darauf aus, sich immer weiter auszudehnen, und bedrohen damit unsere Interessen. Wir müssen unsere eigene Außenpolitik neu ausrichten, um uns ihnen so entschieden wie möglich entgegenzustellen."
 BUL_ww1_BalkanLeagueMenace: "Balkanliga Bedrohung"
 BUL_ww1_BalkanLeagueMenace_desc: ""
 BUL_ww1_GreeceFriend: "Allianz mit Griechenland"
 BUL_ww1_GreeceFriend_desc: "Es ist schwer, ein Volk zu finden, das mehr Grund als die Griechen hat, die Osmanen zu hassen! Sie werden nicht zögern, einem Bündnis mit uns zuzustimmen. Übrigens haben unsere Diplomaten in Athen bereits mit der Arbeit daran begonnen."
 BUL_ww1_bulgaria_first: "Bulgarien zuerst"
 BUL_ww1_bulgaria_first_desc: "Angesichts des noch recht jungen bulgarischen Nationalbewusstseins lässt sich unser Volk leicht von nationalistischer Propaganda beeinflussen. Wir sollten dies zum Wohle unserer Regierung und Armee weiter vorantreiben."
 BUL_ww1_recognize_minorities: "Minderheiten anerkennen"
 BUL_ww1_recognize_minorities_desc: "Wenn wir die nationale Einheit erreichen wollen, müssen wir die Existenz der Vielfalt der Völker innerhalb unseres eigenen Volkes anerkennen. Erkennen wir den Sonderstatus der ethnischen Minderheiten innerhalb Bulgariens an, wird das Land besser funktionieren."
 BUL_ww1_meet_croatian_leaders: "Treffen mit kroatischen Führungskräften"
 BUL_ww1_meet_croatian_leaders_desc: "Zwischen Bulgaren und Kroaten gibt es viel zu besprechen. Unsere Interessen sind deckungsgleich und eine Zusammenarbeit mit ihnen könnte uns viel bringen. Lassen Sie uns einen diplomatischen Gipfel mit der Führung Kroatiens abhalten, und wir können interessante Erkenntnisse gewinnen."
 BUL_ww1_support_croatia_revolt: "Kroatische Revolte unterstützen"
 BUL_ww1_support_croatia_revolt_desc: "Alles, was unsere mächtigen Nachbarn schwächt, ist in unserem Sinne. Daher müssen die kroatischen Aufständischen vorbehaltlos unterstützt werden. Es muss der Befehl erteilt werden, ihnen einige Schiffsladungen Munition und Waffen zu schicken, damit sie ihren eigenen Kampf führen können."
 BUL_ww1_anti_fr: "Anti-französische Politik"
 BUL_ww1_anti_fr_desc: "Die Franzosen sind arrogant und glauben, dass sie überall zu Hause sind. Wir müssen dafür sorgen, dass unser diplomatisches Korps trocken und hart mit ihnen umgeht, damit sie sich um ihre eigenen Angelegenheiten kümmern."
 BUL_ww1_anti_uk: "Anti-Britische Politik"
 BUL_ww1_anti_uk_desc: "Die Briten sind arrogant und glauben, dass sie überall zu Hause sind. Wir müssen dafür sorgen, dass unser diplomatisches Korps trocken und hart mit ihnen umgeht, damit sie sich um ihre eigenen Angelegenheiten kümmern."
 BUL_ww1_reinforce_ports: "Ausbau der Werften"
 BUL_ww1_reinforce_ports_desc: "Durch den Kauf von ungenutztem oder verlassenem Küstenland zum Ausbau unserer bestehenden Infrastruktur könnten wir unsere Arsenale und Werften vergrößern."
 BUL_ww1_assert_position_east: "Ministerium für Inneres"
 BUL_ww1_assert_position_east_desc: "Wir haben unsere Meinung zu internationalen und vor allem westlichen Themen kundgetan. Nun wäre es klug, das Gleiche für den Osten zu tun, denn auch auf der Seite, auf der die Sonne aufgeht, mangelt es nicht an Konflikten."
 BUL_ww1_develop_the_country: "Entwicklung des Landes"
 BUL_ww1_develop_the_country_desc: "Wir sollten die rasante Entwicklung unseres Landes fortsetzen. Bessere Dienstleistungen, Straßen und Eisenbahnen wären durchaus wünschenswert."
 BUL_ww1_LimitDemocracy: "Begrenzte Freiheit"
 BUL_ww1_LimitDemocracy_desc: "Sicherlich hat die Demokratie ihre guten Seiten. Aber zu viel Demokratie ist ein Fehler, und wir werden uns in Mutmaßungen und unfruchtbaren Debatten verlieren, wenn wir so weitermachen. Beschränken wir den Ausdruck der Demokratie, wenn wir verhindern wollen, dass das Land zu sehr geschwächt wird."
 BUL_ww1_remove_claims_on_ottoman: "Ansprüche auf Osmanien entfernen"
 BUL_ww1_remove_claims_on_ottoman_desc: "Wenn wir unsere Beziehungen befrieden wollen, dann müssen wir aufhören, alles und jeden auf unsere osmanischen Nachbarn zu beanspruchen. Lassen Sie uns offiziell auf diese alten Rivalitäten verzichten, und sie werden es umso mehr zu schätzen wissen."
 BUL_ww1_stop_support_albania: "Albaniens Souveränität anfechten"
 BUL_ww1_stop_support_albania_desc: "Die Albaner haben nicht die Mittel für ihre Ambitionen! Sie müssen an dem ihnen zugewiesenen Platz bleiben und dürfen sich nicht in unsere Angelegenheiten einmischen. Wir müssen ihre Souveränität ab sofort anfechten, da sie Land besitzen, das rechtmäßig uns gehört."
 BUL_ww1_stop_support_montenegro: "Montenegro ist schwach"
 BUL_ww1_stop_support_montenegro_desc: "Dieses montenegrinische Fürstentum ist schwach und wehrlos. Wenn es schon von einem seiner Nachbarn absorbiert werden muss - dann doch lieber von uns!"
 BUL_ww1_balkan_war_propaganda: "Kritik an Londoner Friedenskonferenz"
 BUL_ww1_balkan_war_propaganda_desc: "Diese arroganten Briten gaben vor, die Myriaden von Meinungsverschiedenheiten, die sich aus den jüngsten Ereignissen im östlichen Mittelmeerraum ergaben, endlich beizulegen, aber es wurde nichts getan! Wir müssen die Schlussfolgerungen dieser Konferenz offiziell kritisieren, da wir mit ihnen nicht zufrieden sind."
 BUL_balkan_league: "Balkan-Liga"
 BUL_balkan_league_desc: ""
 BUL_second_balkan: "Mehr Territorium fordern"
 BUL_second_balkan_desc: ""
 BUL_central_powers: "Den Mittelmächten beitreten"
 BUL_central_powers_desc: ""
 BUL_greater_bulgaria: "Großbulgarien"
 BUL_greater_bulgaria_desc: ""
 BUL_peace_and_neutrality: "Frieden und Neutralität"
 BUL_peace_and_neutrality_desc: "Wir haben die Gebiete erobert, die wir brauchen. Auch wenn viele wichtige Persönlichkeiten auf weitere Gebietsgewinne und vielleicht sogar auf ein Großbulgarien drängen, ist Vorsicht wichtiger denn je. Diese Politik mag zwar unpopulär sein, aber wir können keinen Angriffskrieg riskieren, wenn vier Nachbarländer unser Land begehren. Lasst uns also Frieden predigen und uns auf das konzentrieren, was wir haben..."
 BUL_deterrence_policy: "Abschreckungspolitik"
 BUL_deterrence_policy_desc: "Frieden zu predigen reicht möglicherweise nicht aus. Lasst uns daher potenzielle Angreifer durch militärische Stärke und Befestigungsanlagen abschrecken. Wenn wir vorhaben, auf uns allein gestellt zu bleiben, müssen wir in der Lage sein, uns selbst zu verteidigen."
 BUL_second_balkan_defeat: "Niederlage im Zweiten Balkankrieg"
 BUL_second_balkan_defeat_desc: "Nachdem wir von Serbien und seinen Verbündeten besiegt wurden, befinden wir uns nicht mehr in derselben Machtposition wie nach dem Ersten Balkankrieg. Daher müssen wir vorsichtig bleiben, bis wir eine günstige Gelegenheit finden, unsere integralen mazedonischen und thrakischen Gebiete zurückzugewinnen. Vielleicht ist es an der Zeit, darüber nachzudenken, in der Politik der Großmächte Partei zu ergreifen?"
 BUL_second_balkan_defeat_tt: "§RNiederlage§! im §YZweiten Balkankrieg§! wird neue politische Optionen ermöglichen."
 BUL_revanchist_policy: "Revanchistische Politik"
 BUL_revanchist_policy_desc: "Nachdem unsere Nachbarn nach dem Zweiten Balkankrieg ungerechtfertigterweise unsere integralen Gebiete gestohlen haben, ist der Revanchismus in Bulgarien weit verbreitet. Und obwohl die Niederlage schmerzt, hat sie unserem Militär und unserer Regierung endlich den Wert von Vorsicht und Opportunismus gelehrt. Wenn sich die Gelegenheit bietet, müssen wir zuschlagen, und zwar hart!"
 BUL_second_balkan_victory: "Sieg im Zweiten Balkankrieg"
 BUL_second_balkan_victory_desc: "Nachdem wir Serbien im Zweiten Balkankrieg besiegt haben, können wir nun weitere Eroberungen auf dem Balkan vornehmen, während keines der ehemaligen Mitglieder des Völkerbundes in der Lage ist, uns daran zu hindern..."
 BUL_second_balkan_victory_tt: "§GSieg§! im §YZweiten Balkankrieg§! wird neue politische Optionen ermöglichen."
 BUL_expansionist_policy: "Expansionspolitik"
 BUL_expansionist_policy_desc: "Nachdem wir unsere Nachbarn endgültig besiegt haben, befinden wir uns in einer relativen Machtposition, wie wir sie seit dem Mittelalter nicht mehr gesehen haben. Viele Mitglieder unserer Regierung und unseres Militärs möchten unsere Nordflanke ein für alle Mal sichern. Ein entscheidender Schlag gegen Rumänien ist geplant, und wenn dieser erfolgreich ist, soll das Land zu einem richtigen Satellitenstaat gemacht werden."
 BUL_making_amends: "Wiedergutmachung leisten"
 BUL_making_amends_desc: "Indem wir unsere Hilfe in anderen Angelegenheiten anbieten, können wir versuchen, den anderen Nationen des Balkans klar zu machen, dass wir nicht ihr Feind sein müssen."
 BUL_pact_with_montenegro: "Pakt mit Montenegro"
 BUL_pact_with_montenegro_desc: "Einen Pakt mit Montenegro zu schließen, dürfte nicht allzu schwer sein, da sie von vornherein kaum Grund hatten, sich uns zu widersetzen."
 BUL_pact_with_serbia: "Pakt mit Serbien"
 BUL_pact_with_serbia_desc: "Einen Pakt mit Serbien zu schließen, könnte sich als schwierige Aufgabe erweisen. Wenn wir jedoch ihre Ansprüche auf Nordalbanien unterstützen und versprechen, bei der Befreiung der übrigen südslawischen Gebiete zu helfen, können wir ihnen zumindest einen Trostpreis anbieten."
 BUL_pact_with_greece: "Pakt mit Griechenland"
 BUL_pact_with_greece_desc: "Indem wir ihnen unsere Unterstützung bei der Durchsetzung ihrer Ansprüche in Südalbanien und Westanatolien zusichern, können wir die griechischen Interessen mit unseren eigenen in Einklang bringen und verhindern, dass sie in naher Zukunft Rache an uns nehmen."
 BUL_partition_of_albania: "Teilung Albaniens"
 BUL_partition_of_albania_desc: "Die Zeit ist gekommen, Albanien wird das unglückliche Opfer unserer diplomatischen Verhandlungen sein und aufhören zu existieren."
 BUL_leader_of_south_slavs: "Südslawische Führung"
 BUL_leader_of_south_slavs_desc: "Wir haben uns als Anführer der Südslawen etabliert und sind in der Lage, unser Volk gemeinsam zu Größe zu führen."
 BUL_tsargrad: "Zargrad"
 BUL_tsargrad_desc: "Das Verlangen der Stadt der Welten liegt direkt vor unserer Haustür, und es liegt in unserem Interesse, es zu kontrollieren, um die Kontrolle über den Bosporus zu sichern."
