 TUR_the_opda: "L’OPDA"
 TUR_the_opda_desc: "L’Administration ottomane de la dette publique a été créée en raison de nos dettes colossales impayées envers la France, la Grande-Bretagne et l’Allemagne. Cette administration contrôle la quasi-totalité de notre économie et nous rend dépendants des produits étrangers. Si nous voulons reprendre le contrôle de notre propre économie, nous devons rembourser nos dettes colossales.\n\nTotal §YDebt§!: [?TUR_opda_debt_var] §YMillion§! lires ottomanes"
