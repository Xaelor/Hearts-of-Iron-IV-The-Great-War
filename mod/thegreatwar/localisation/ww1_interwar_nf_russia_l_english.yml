l_english:
 #--------------------------------------------------------------
 # [RUSSIA & WHITE RUSSIA] Interwar
 #=========================================================================

 RUS_int_honor_the_imperial_family:0 "Honor the Imperial Family"
 RUS_int_honor_the_imperial_family_desc:0 "Even though we would like to, we cannot simply erase centuries of history. The Romanov dynasty is a part of Russia, whether imperial or Bolshevik, therefore we must grant them a minimum degree of dignity. And incidentally, this will also send a very positive signal of respect to the external powers that are monitoring the situation here."

 RUS_int_support_kirill_vladimirovich:0 "Support Kirill Vladimirovich"
 RUS_int_support_kirill_vladimirovich_desc:0 "Since Nikolay II was murdered by the Reds, the list of claimants to the Tsarist throne has been reduced. The most legitimate of them is the son of Grand Prince Vladimir and Grand Duchess Pavovna. He is the one we must recognize as ruler."

 RUS_int_negotiate_with_trotsky:0 "Negotiate with Trotsky"
 RUS_int_negotiate_with_trotsky_desc:0 "Perhaps it is time to face reality. The Bolsheviks are too strong. If we cannot restore the Empire by force, then perhaps a constitutional Tsarism is the price for our nation's survival."

 RUS_int_disinherit_kirill_vladimirovich:0 "Disinherit Kirill Vladimirovich"
 RUS_int_disinherit_kirill_vladimirovich_desc:0 "He, the Tsar? We haven't forgotten that when the throne was tottering, Prince Vladimirovich was the first to betray us. He was the one who, at the head of the Guards Fusiliers, attacked the Tauride Palace, wearing a red shirt as a sign of allegiance to the Bolsheviks! There's no question of leaving such an opportunist on the throne of the Third Rome..."

 RUS_int_reestablish_the_zemsky_sobor:0 "Reestablish the Zemsky Sobor"
 RUS_int_reestablish_the_zemsky_sobor_desc:0 "In the past, there was an assembly of representatives from all regions of the empire, who came from all states and represented the various social classes and peoples that make up Russia. At a time when we urgently need unity and stability in the country, could this be an excellent solution? People would not only feel heard, but we would also receive diverse opinions on the issues that interest us."

 RUS_int_tsar_michael_ii:0 "Tsar Michael II"
 RUS_int_tsar_michael_ii_desc:0 "Since Tsar Nikolay II has died, the throne passes to his younger brother, Grand Duke Michael Alexandrovich Romanov. He is a wise and responsible man, but he has so far refused the throne until he is recognized as Tsar by the Russian people. This is to his credit, but we need a ruler, and we need one immediately. We will place him on the throne as soon as possible."

 RUS_int_reconciliation:0 "Reconciliation"
 RUS_int_reconciliation_desc:0 ""

 RUS_int_accept_polish_independence:0 "Accept Polish Independence"
 RUS_int_accept_polish_independence_desc:0 "There is a time for imperialism and a time for survival. The Poles desperately want to be independent and free, and we don't have the means today to keep them under our yoke. Let's accept their demands for independence; that is the only logical choice we can make: there will always be time later to take them back under our wing..."

 RUS_int_improve_russo_finnish_relations:0 "Improve Russo-Finnish Relations"
 RUS_int_improve_russo_finnish_relations_desc:0 "A new country has been born and we must maintain good relations with it, otherwise we have a dangerous adversary less than an hour's drive from St. Petersburg! Let's send diplomats to Helsinki and begin improving relations."

 RUS_int_all_the_russias:0 "All the Russias"
 RUS_int_all_the_russias_desc:0 "Russia stretches from the Baltic Sea to the Pacific Ocean, covering a third of the Earth and most of Eurasia. It unites dozens of peoples, cultures, and religions, and to find our way back to unity, we should remember this essential concept: There is one Russia, made up of many Russians..."

 RUS_int_reclamation:0 "Reclamation"
 RUS_int_reclamation_desc:0 ""

 RUS_int_reclaim_the_baltic:0 "Reclaim the Baltic"
 RUS_int_reclaim_the_baltic_desc:0 "Our control over the Baltic Sea must be complete, and if we falter at a time when Russia is wavering, the revolt will spread like wildfire! We will crush the Balts, as is fitting. Several army corps are still stationed near Petrograd; we can quickly draw up an offensive plan."

 RUS_int_retake_the_caucasus:0 "Retake the Caucasus"
 RUS_int_retake_the_caucasus_desc:0 "The Caucasus is rich in raw materials; we must not let it fall under the influence of another power. It has colossal oil and gas reserves, water, forests teeming with wildlife, and vast agricultural areas that yield excellent harvests. No one but us should own it!"

 RUS_int_reclaim_the_finnish_throne:0 "Reclaim the Finnish Throne"
 RUS_int_reclaim_the_finnish_throne_desc:0 "The Bolsheviks accepted Finnish independence as long as it helped them consolidate their power. But that's over; we must demand our sovereignty over this territory."

 RUS_int_burn_the_treaty_of_fredrikshamn:0 "Burn the Treaty of Fredrikshamn"
 RUS_int_burn_the_treaty_of_fredrikshamn_desc:0 ""

 RUS_int_reconquer_chukotka:0 "Reconquer Chukotka"
 RUS_int_reconquer_chukotka_desc:0 ""

 RUS_int_refuse_polish_independence:0 "Refuse Polish Independence"
 RUS_int_refuse_polish_independence_desc:0 "Poland must remain an integral part of our great Russian Empire, if we give in to the separatists, the whole Empire risks breaking up!"

 ############################################################################################
