l_english:
 form_rattanakosin_kingdom:0 "Strengthen the Rattanakosin Heritage"
 form_rattanakosin_kingdom_category:0 "Strengthen the Rattanakosin Heritage"
 form_rattanakosin_kingdom_category_desc:0 "In recent years we have moved away from the traditional values our nation was originally founded upon. Now that we have reached the territorial extent from our glory days, perhaps it is time to embrace our history more tightly."
 form_ayutthaya_kingdom:0 "Pivot to the Past"
 form_ayutthaya_kingdom_category:0 "Pivot to the Past"
 form_ayutthaya_kingdom_category_desc:0 "For centuries we have moved to a new capital to Bangkok because the old capital had become in ruins. It has become a myth that our ancestors often told us that it was once magnificent and grand. It is time for us to rebuild that city as great as our ancestors said and dream of making it great again." 
 form_grand_siamese_kingdom:0 "Make Siam Great Agian"
 form_grand_siamese_kingdom_category:0 "Maha Anachak Siam"
 form_grand_siamese_kingdom_category_desc:0 "In our past we used to be great and we've failed. It's been like this many times. But it won't happen again, because we will create our new history and we will learn from the past and will prevent it from happening again in the future."
 form_siamese_china_kingdom:0 "Form Zhèng Dynasty and the Empire"
 form_siamese_china_category:0 "Zhèng Dynasty and Siamese China Empire"
 form_siamese_china_category_desc:0 "All monarchs and royal family member of Chakrī Dynasty are Chinese descent. “Zhèng” is a Chinese surname of Chakrī Dynasty. And now we have conquered the mainland of China. Therefore, the dragon throne must be ours and we shall established the Zhèng dynasty in place of the Qing dynasty "
