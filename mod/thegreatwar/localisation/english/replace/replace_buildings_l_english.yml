l_english:
 landmark_kremlin_desc: "The Moscow Kremlin is a fortified complex. Within the complex is the Grand Kremlin Palace, which served as the royal residence of the Emperor of Russia. The Kremlin overlooks the Moskva River to the south, Saint Basil's Cathedral and Red Square to the east, and Alexander Garden to the west. Its the reminder of Tsar's authority over the state."
 landmark_berlin_reichstag_desc: "The Plenarbereich Reichstagsgebäude, also known as the Reichstag, is the legislative government building on Platz der Republik in Berlin. It is the place where the imperial laws pass and it is the symbol of German democracy."
 landmark_hofburg_palace_desc: "The Hofburg is the principal imperial palace of the Habsburg dynasty, and faces towards the Heldenplatz. It is used  used by the rulers of Austrian Empire."
 landmark_sadabad_complex_desc: "Built by the Qajar Dynasty, the Sa'dabad Complex in northern Tehran serves as a royal residence and seat of power. Its palaces and gardens reflect Iran’s shifting political landscape, from conservatism to modernism."
 landmark_hagia_sophia_desc: "Standing at the crossroads of empires, the Hagia Sophia has been a Byzantine cathedral and now a Ottoman mosque, it is a symbol of Konstantiniyye’s ever-changing rulers. Its massive dome and grand halls reflect both its spiritual significance and the ambitions of those who claimed the city as their own."
