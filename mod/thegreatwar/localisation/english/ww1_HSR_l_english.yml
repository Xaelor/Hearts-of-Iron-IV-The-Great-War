l_english:
#Ideas
 HSR_economic_blockade: "Economic Blockade"
 HSR_economic_blockade_desc: "Little Entente, composed of Czechoslovaks, Romanians and Yugoslavs, have imposed major sanctions on us since we try to take at least some of our land back."
#Focuses
 HSR_end: "The End?"
 HSR_end_desc: "Our republic has lost control of most of its territory, and we must decide what to do next. We can try to reclaim our lands, or accept defeat and seek peace."
 HSR_backup: "Seek an Armistice"
 HSR_backup_desc: "We must end the fighting and make peace with the Little Entente. Otherwise, Hungary may be dismembered entirely."
 HSR_tisa_offensive: "Prepare the Tisza Offensive"
 HSR_tisa_offensive_desc: "We will gather all of our forces for an offensive along the Tisza and try to break the encirclement."
 HSR_crush_czechs: "Crush the Czechs"
 HSR_crush_czechs_desc: "we almost finished crushing czechs. Lets do it!"
 HSR_withdraw_from_slovakia: "Withdraw from Slovakia"
 HSR_withdraw_from_slovakia_desc: "We can end hostilities with Czechoslovakia and withdraw from Slovakia before the conflict costs us even more."
 HSR_ensure_peace_and_stability: "Ensure Peace and Stability"
 HSR_ensure_peace_and_stability_desc: "With the fighting over, we can turn our attention to restoring order and strengthening the republic."
 HSR_seek_peace_with_ROM: "Seek Peace with Romania"
 HSR_seek_peace_with_ROM_desc: "Our campaign has reached its limits. We should offer Romania peace before further losses make our position untenable."
 HSR_economic_stuff1: "hungarian economy"
 HSR_economic_stuff1_desc: "The blockade has crippled our industry. Rebuilding our factories is the first step toward recovery."
 HSR_Open_new_routes_to_AUS: "Open New Trade Routes with Austria"
 HSR_Open_new_routes_to_AUS_desc: "By restoring trade links with Austria, we can ease the economic blockade and secure access to vital supplies."
 HSR_invest_in_soc_construction: "Invest in construction"
 HSR_invest_in_soc_construction_desc: "Investment in socialist construction will help rebuild our industry and further weaken the blockade."
 HSR_negotiate_YUG: "Negotiate with Yugoslavia"
 HSR_negotiate_YUG_desc: "We should seek an agreement with Yugoslavia to improve relations and bring the economic blockade to an end."
 HSR_maintain_curse: "maintain the curse"
 HSR_maintain_curse_desc: "we need to continue on working for communism with Bela Kun."
