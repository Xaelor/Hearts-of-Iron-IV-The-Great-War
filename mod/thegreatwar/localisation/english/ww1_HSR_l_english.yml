 HSR_invest_in_soc_construction: "Invest in Construction"
 HSR_invest_in_soc_construction_desc: "Investment in socialist construction will help rebuild our industry and further weaken the blockade."
 HSR_negotiate_YUG: "Negotiate with Yugoslavia"
