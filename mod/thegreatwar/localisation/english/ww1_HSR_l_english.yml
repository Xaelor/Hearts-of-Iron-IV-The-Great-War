 HSR_ensure_peace_and_stability: "Ensure Peace and Stability"
 HSR_ensure_peace_and_stability_desc: "With the fighting over, we can turn our attention to restoring order and strengthening the republic."
 HSR_seek_peace_with_ROM: "Seek Peace with Romania"
 HSR_seek_peace_with_ROM_desc: "Our campaign has reached its limits. We should offer Romania peace before further losses make our position untenable."
 HSR_economic_stuff1: "hungarian economy"
 HSR_economic_stuff1_desc: "The blockade has crippled our industry. Rebuilding our factories is the first step toward recovery."
 HSR_Open_new_routes_to_AUS: "Restore Austrian Trade"
