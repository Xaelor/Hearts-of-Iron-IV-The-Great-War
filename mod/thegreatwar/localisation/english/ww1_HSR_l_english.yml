#Events
 int_communist_hungary.1.t: "Entente Demand for Burgenland"
 int_communist_hungary.1.d: "On 20 July 1919, representatives of the Entente Powers informed the Hungarian government of their demands concerning the western Hungarian territories. During the Paris Peace Conference of 1919, Britain, France, Italy and the United States discussed the new territorial order in Central Europe following the collapse of the Austro-Hungarian Monarchy. The Austrian government had laid claim to territories in western Hungary, particularly those inhabited by a significant German-speaking population. The victorious Allied Powers considered the transfer of these territories to Austria necessary for establishing the new border between the two countries. On 10 September 1919, Austria's new territorial arrangements would be formally established by the Treaty of Saint-Germain. The Entente now demands that Hungary accept the transfer of Burgenland to Austria. If we do not accept, we risk further isolation and potential military action."
 int_communist_hungary.1.a: "Accept the transfer of Burgenland"
 int_communist_hungary.1.b: "Reject the Entente's demand"

 int_communist_hungary.2.t: "The Yugoslav Question"
 int_communist_hungary.2.d: "We have met with Yugoslav diplomats to seek an agreement to remove the blockade against us. Their only demands are that we stop claiming Vojvodina and agree to the dismemberment of the Yugoslavian Communist Federation. This is a serious problem for their government."
 int_communist_hungary.2.a: "Dismember the YCF (Accept)"
 int_communist_hungary.2.b: "The YCF is quite strong in Yugoslavia. In a few months, Yugoslavia will become communist, and they will remove the blockade themselves. (Reject)"

 int_communist_hungary.3.t: "The end?..."
 int_communist_hungary.3.d: "..Or not yet. The Hungarian Soviet Republic stands on the brink of a decisive moment. The ongoing war with Romania has exhausted our forces and weakened the nation's morale. With the future of the revolution hanging in the balance, our government must choose its next course of action.\n\nWe may launch a decisive offensive across the Tisza River to crush the Romanian threat and restore the fighting spirit of our people. Alternatively, we could seek a white peace, sacrificing our ambitions in exchange for the survival of the republic. A third option would be to pursue a balanced strategy, strengthening our military and political position through careful planning rather than risking everything in a single campaign.\n\nThe fate of the republic rests upon our decision."
 int_communist_hungary.3.a: "We firstly need to put Romania out of the game, and then we can talk (Tisza offensive)"
 int_communist_hungary.3.b: "The war is already lost. We can accept a small defeat to save the republic (peace out)"
 int_communist_hungary.3.c: "The idea of total war and “white” peace aren't ways, those are just suicide pills. We must adopt a balanced approach to gain our way to the Victory."

 int_communist_hungary.4.t: "The Burgenland Question"
 int_communist_hungary.4.d: "Some time has passed since we were forced to return Burgenland to Austria. Time has passed, and our republic has recovered, while the Entente is still screwing around. We can force Austria to return this region, which will probably make them angry and they'll do the only thing they can: ban the Austrian Communist Party, and maybe even impose an embargo—who knows?\n\nOn the other hand, we can work with them to implement the “Sudetenland in 3 days” plan, and then it will be something like an exchange of Burgenland (another Austrian territory) for the Sudetenland."
 int_communist_hungary.4.a: "Force Austria to return Burgenland"
 int_communist_hungary.4.b: "Work with Austria to implement the Sudetenland plan"

 int_communist_hungary.5.t: "The Burgenland Question"
 int_communist_hungary.5.d: "The Hungarian government has informed Mr. Seitz of their ultimatum to seize Burgenland back to Hungary.However, the Soviet Hungarian army is thrice bigger than ours, so we need to give it up, and blame the communist party. Also, we could try to resist, but the choice is up to you, Mr. President."
 int_communist_hungary.5.a: "Let's give up, we don't stand a chance against them"
 int_communist_hungary.5.b: "Resist. That's the only way."

 int_communist_hungary.6.t: "The Burgenland Question"
 int_communist_hungary.6.d: "The Hungarian government has proposed a military cooperation against the Czechs.\n\nThe deal is simple: we defeat the Czechs and get Sudetenland, but in return, we have to give back Burgenland."
 int_communist_hungary.6.a: "Of course, Mr Kun. We always wanted this region back."
 int_communist_hungary.6.b: "Lets try to return firstly the region by diplomacy, send an ultimatum to cede south sudetes."

 int_communist_hungary.7.t: "The South Problem"
 int_communist_hungary.7.d: "Yugoslavia controls way too much territory, and especially Hungarian. We need to send them a letter to demand back at least Bácska or, we could simply invade them to pursue the liberation of the Croatian proletariat and integration of South Banat into Hungary."
 int_communist_hungary.7.a: "We need to reclaim our lost territories. Attack!"
 int_communist_hungary.7.b: "Send a letter to Yugoslavia demanding Bácska"

 int_communist_hungary.8.t: "Soviet Hungary's Demands"
 int_communist_hungary.8.d: "The Hungarian Soviet Republic has sent a letter to the Yugoslav government, demanding the return of Bácska to Hungary.\n\nWe have just come out of the 4th war in these past 10 years, and can prosper. But the will to resist has not yet perished among the Yugoslavs."
 int_communist_hungary.8.a: "We don't need a region full of Hungarians, take it, go ahead."
 int_communist_hungary.8.b: "We will not give up Bačka, the rightful Serbian territory."

 int_communist_hungary.9.t: "Austrian demands"
 int_communist_hungary.9.d: "The austrian government has sent an ultimatum with the back up of soviet hungary to cede south sedetenland to them. "
 int_communist_hungary.9.a: "we have no chance against both of them, and anyways there is no important factories and its majoritarely german."
 int_communist_hungary.9.b: "We will not give up south sedetenland, it's our rightfull territory."

 int_communist_hungary.10.t: "north transylvania nationalization"
 int_communist_hungary.10.d: "we can finaly nationalise north transylvania because we have 90% compliance."
 int_communist_hungary.10.a: "Cool"
