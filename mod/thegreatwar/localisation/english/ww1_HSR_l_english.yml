 HSR_end: "The End?"
 HSR_end_desc: "Our republic has lost control of most of its territory, and we must decide what to do next. We can try to reclaim our lands, or accept defeat and seek peace."
 HSR_backup: "Seek an Armistice"
 HSR_backup_desc: "We must end the fighting and make peace with the Little Entente. Otherwise, Hungary may be dismembered entirely."
 HSR_tisa_offensive: "Prepare the Tisza Offensive"
 HSR_tisa_offensive_desc: "We will gather all of our forces for an offensive along the Tisza and try to break the encirclement."
 HSR_crush_czechs: "Crush the Czechs"
