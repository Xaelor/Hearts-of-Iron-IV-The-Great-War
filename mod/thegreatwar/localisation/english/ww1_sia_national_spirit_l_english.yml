 SIA_Bowring_Treaty_1855:0 "Bowring Treaty 1855"
 SIA_Bowring_Treaty_1855_desc:0 "The Bowring Treaty is an 18 April 1855 agreement that Great Britain pressured the Kingdom of Siam to accept, which liberalized foreign trade in Siam . Notably, under the treaty, Siam was to allow British ships to import opium into Siam, modeled on such unequal treaties earlier forced on China for the British importation of the narcotic into that country."
