 RUS_ww1_sikorsky_airplane_research_desc:0 "The genius of Igor Sikorsky in the field of aviation is beyond doubt. We must support this talented engineer so that he can develop Russian planes capable of rivaling, if not exceeding, the performance of those of the other great powers."
