 RUS_ww1_political_effort:0 "Political Effort"
 RUS_ww1_political_effort_desc:0 ""
 RUS_ww1_reject_reforms:0 "Reject The Reforms"
 RUS_ww1_reject_reforms_desc:0 "The reforms proposed by our opponents have only one goal, weakening the Empire and the Tsar. We must not show any weaknesses. They would take advantage of this to stab us."
 RUS_ww1_adopt_reforms:0 "Adopt The Reforms"
 RUS_ww1_adopt_reforms_desc:0 "The Empire is under attack from all sides, maybe we should accept some reforms proposed by the opposition. If we do nothing, we run the risk of seeing revolutionary movements appear."
 RUS_ww1_condemn_marxist_ideas:0 "Condemn Marxist Ideas"
 RUS_ww1_condemn_marxist_ideas_desc:0 ""
 RUS_ww1_crush_strikes:0 "Crush Strikes"
 RUS_ww1_crush_strikes_desc:0 ""
 RUS_strengthen_the_constitution:0 "Strengthen The Constitution"
 RUS_strengthen_the_constitution_desc:0 ""
 RUS_ww1_arrest_opposition_leaders:0 "Arrest Opposition Leaders"
 RUS_ww1_arrest_opposition_leaders_desc:0 ""
 RUS_ww1_dissolve_imperial_duma:0 "Dissolve the Imperial Duma"
 RUS_ww1_dissolve_imperial_duma_desc:0 ""
 RUS_ww1_reinforce_tsar_authority:0 "Reinforce The Tsar Authority"
 RUS_ww1_reinforce_tsar_authority_desc:0 "The legitimate authority of the Tsar is constantly questioned, we must take strong measures to put an end to this, even if it means making enemies."
 RUS_ww1_purge_imperial_guard:0 "Purge of the Imperial Guard"
 RUS_ww1_purge_imperial_guard_desc:0 ""
 RUS_ww1_discuss_tsar_authority:0 "Discuss The Tsar Authority"
 RUS_ww1_discuss_tsar_authority_desc:0 "The Tsar may have too much power, perhaps we should take inspiration from the British to strengthen the power of parliamentarians before it's too late and the Empire collapses on itself."
 RUS_ww1_parliamentary_immunity:0 "Parliamentary Immunity"
 RUS_ww1_parliamentary_immunity_desc:0 ""
