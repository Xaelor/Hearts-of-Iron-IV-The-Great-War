#Ideas
 SPR_ww1_the_spanish_economy_ns: "The Spanish Economy"
 SPR_ww1_the_disaster_of_98_ns: "The Disaster of 98'"
 SPR_ww1_the_disaster_of_98_ns_desc: "Though once the world's foremost empire, a resounding defeat in the Spanish-American War and a sale of the Spanish Pacific to Germany has reduced the Empire to a few minor outposts in Africa, which has made the country nothing more than a regional power. Many still feel revanchism for the lost territory."
 SPR_ww1_turnismo_ns: "Turnismo"
 SPR_ww1_turnismo_ns_desc: "Direct cooperation between the Conservative and Liberal parties of Spain has led to the Turno system, where the parties exchange power on a regular basis to make the sham democracy look more competitive. In reality, both parties are controlled by the King and the aristocracy, and most people seem to know it."
 SPR_ww1_influencial_unions_ns: "Influencial Unions"
 SPR_ww1_enshrined_workplace_safety_standards_ns: "Enshrined Workplace Safety Standards"
 SPR_ww1_servicio_nacional_de_inteligencia_ns: "Servicio Nacional de Inteligencia"
 SPR_ww1_arrested_enemies_of_the_state_ns: "Arrested Enemis of the State"
#Focuses
 SPR_ww1_stand_behind_the_turnismo: "Stand Behind the Turnismo"
 SPR_ww1_stand_behind_the_turnismo_desc: ""
 SPR_ww1_strengthen_the_political_machine: "Strengthen the Political Machine"
 SPR_ww1_strengthen_the_political_machine_desc: "In Caciquismo, party bosses Caciques control the voters in parliamentary elections and often speak on their behalf to the government. While an important part in keeping the illusion of democracy running, their ambitions and ideas are dangerous. We should remind the Caciques just who's in charge."
 SPR_ww1_the_canalejas_electoral_reforms: "The Canalejas Electoral Reforms"
 SPR_ww1_the_canalejas_electoral_reforms_desc: "The Liberal Turno, José Canalejas, has started an uncharacteristically ambitious group of reforms in Spain aimed at essentially all walks of life. While most of these reforms are fairly radical, by Spanish standards anyway, King Alfonso can be the backing force for Canalejas's more interesting ideas."
 SPR_ww1_obscure_turno: "Obscure Turno"
 SPR_ww1_obscure_turno_desc: "El Turno Pacífico is the system by which our good King exerts power. Controlled elections between two ideologically identical parties gives the illusion of democracy. In reality, both sides work for Alfonso. However, the people have largely figured out what's happening here. Some smoke and mirrors to hide the process will assure the people the broken system works."
 SPR_ww1_tackle_the_unions: "Tackle the Unions"
 SPR_ww1_tackle_the_unions_desc: "The fledgling Spanish economy is hindered greatly by Socialist and Communist-supporting Unions throughout the Spanish countryside. Highly organized, political, and cooperative, they present the biggest danger to economic growth and our regime. The bosses have told us they can handle it- perhaps we should trust their judgement."
 SPR_ww1_squash_the_cnt_remnants: "Squash the CNT Remnants"
 SPR_ww1_squash_the_cnt_remnants_desc: ""
 SPR_ww1_enshrine_workplace_safety_standards: "Enshrine Workplace Safety Standards"
 SPR_ww1_enshrine_workplace_safety_standards_desc: "The Instituto Nacional de Previsión, a workplace safety organization, has been largely ignored and ineffective since its inception in 1908. In a time where unions and business antagonize each other, perhaps some modest government intervention, in this case by expanding the organization, could quell the anger of the union workers."
 SPR_ww1_un_nuevo_dia: "Un Nuevo Día"
 SPR_ww1_un_nuevo_dia_desc: "Despite it all, Spain is back. The humiliation of 1898 and the Tragic Week have been forgotten, and the Industry is starting to catch up to European standards. Diplomats are courting Spain again, and the people are happier than they've been in a long time. ¡Vida, vida, futuro de la Patria, que en tus ojos es, abierto corazon!"

 SPR_ww1_embrace_the_unions: "Embrace the Unions"
 SPR_ww1_embrace_the_unions_desc: ""
 SPR_ww1_launch_the_revolution: "Launch the Revolution"
 SPR_ww1_launch_the_revolution_desc: ""

 SPR_ww1_plan_agricola: "Plan Agricola"
 SPR_ww1_plan_agricola_desc: "Very little has changed in the Spanish countryside since the Reconquista. Obsolete tools, obsolete practices, and land ownership laws that just make things even worse. Fortunately, Plan Agricola has been laid out which seeks to address all of these deficiencies, which will hopefully get our farmers on track to modern times."
 SPR_ww1_regional_investments: "Regional Investments"
 SPR_ww1_regional_investments_desc: ""
 SPR_ww1_invest_in_galicia: "Invest In Galicia"
 SPR_ww1_invest_in_galicia_desc: ""
 SPR_ww1_invest_in_basque: "Invest In Basque"
 SPR_ww1_invest_in_basque_desc: ""
 SPR_ww1_invest_in_catalonia: "Invest In Catalonia"
 SPR_ww1_invest_in_catalonia_desc: "Barcelona, strategically placed on the Mediterranean sea in close proximity to both France and Italy, is in a prime spot for industrial expansion. A rapid buildup could be a great short-term fix to get Spanish industry back on the map, though the rushed nature of construction and the unfriendly business administration may upset some locals."
 SPR_ww1_invest_in_madrid: "Invest In Madrid"
 SPR_ww1_invest_in_madrid_desc: ""
 SPR_ww1_invest_in_andalusia: "Invest In Andalusia"
 SPR_ww1_invest_in_andalusia_desc: ""
 SPR_ww1_education_reform: "Education Reform"
 SPR_ww1_education_reform_desc: "Even the most staunch patriot would probably have to admit that the Spanish education system is deficient. One of the issues is an incompetent Board of Education, full of nobles who couldn't make it anywhere else in the Spanish governemnt.Replacing them with more capable administrators would be a great first step to solve the problem."
 SPR_ww1_institucion_libre_ensenanza: "Institucion Libre Enseñanza"
 SPR_ww1_institucion_libre_ensenanza_desc: "A movement rather than an organization, the Institution for Free Learning in Spain seeks to address the reactionary religious education promoted throughout Spain. With just a bit of government support, perhaps more modernist, secular education could have a home here."
 SPR_ww1_improve_infrastructure_in_the_east: "Improve Infrastructure In the East"
 SPR_ww1_improve_infrastructure_in_the_east_desc: "With the recent developments in the Basque Counties and Catalonia, attaching these regions to the existing Spanish rail system has become more important than ever. Even the old existing rail could stand to be electrified."
 SPR_ww1_expand_steel_production: "Expand Eastern Steel Production"
 SPR_ww1_expand_steel_production_desc: "The eastern steel industry has given way to local gun manufacturing by cottage manufacturers like Bonifacio Echeverria and small factories like the P.Unceta y J.Esperanza firm. With a reputation for high-grade steel, these weapons are popular - and promoting their mass production would be a boon for our military industry."

 SPR_int_the_storm_overcomed: "The Storm Overcomed"
 SPR_int_the_storm_overcomed_desc: ""
 SPR_int_miguel_primo_de_riveras_coup: "Miguel Primo De Rivera's Coup"
 SPR_int_miguel_primo_de_riveras_coup_desc: "Just as the Romans once did, the Spanish would be wise to entrust executive and legislative power to a single individual while resolving a crisis. No one can claim that the conditions are not right..."
 SPR_int_establish_the_servicio_nacional_de_inteligencia: "Establish the Servicio Nacional de Inteligencia"
 SPR_int_establish_the_servicio_nacional_de_inteligencia_desc: "To defeat enemies abroad, we must first defeat enemies at home. And we know that traitors and dissidents are out there, everywhere! They must be hunted down, and our intelligence services must be strengthened so that their subversive activities do not escape us."
 SPR_int_arrest_enemies_of_the_state: "Arrest Enemies of the State"
 SPR_int_arrest_enemies_of_the_state_desc: "What good is a list of names if it sits at the bottom of a drawer? Let us follow through and arrest those individuals whose guilt against the Nation is already proven. If nothing else, this approach will curb the spread of communism."
 SPR_int_general_miguel_arrested: "General Miguel Arrested"
 SPR_int_general_miguel_arrested_desc: ""
