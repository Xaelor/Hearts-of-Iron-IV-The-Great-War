#Ideas
 BUL_ww1_bulgarian_army_ns: "The Bulgarian Army"
 BUL_ww1_prussia_of_the_balkans_ns: "Prussia of the Balkans"
#Focuses
 BUL_second_balkan: "Demand More Territory"
 BUL_second_balkan_desc: ""
 BUL_peace_and_neutrality: "Peace and Neutrality"
 BUL_peace_and_neutrality_desc: "We've gained what territories we need. Even though many people of importance are pushing for further territorial gains, and maybe even a Greater Bulgaria, being careful has never been more important. While these policies may be unpopular, we can not risk an offensive war when there's four surrounding countries which covet our lands. Thus, let us preach peace and concentrate on what we have..."
 BUL_deterrence_policy: "Deterrence Policy"
 BUL_deterrence_policy_desc: "Preaching peace may not be enough. Let us therefore deter any would-be aggressors by military might and fortifications. If we plan on staying on our own, we must be able to defend ourselves."
 BUL_second_balkan_defeat: "Defeat in the Second Balkan War"
 BUL_second_balkan_defeat_desc: "Having been bested by Serbia and their allies, we're no longer in the position of power we were after the First Balkan War. As such we'll have to stay careful until we can find an opportunistic way to regain our integral Macedonian and Thracian lands. Maybe it's time to consider taking a side in the politics of the Great Powers?"
 BUL_second_balkan_defeat_tt: "§RDefeat§! in §Ythe Second Balkan War§! will enable new political options."
 BUL_cope_with_the_loss: "Cope With the Loss"
 BUL_cope_with_the_loss_desc: ""
 BUL_ww1_repair_relations_with_russia: "Repair Relations With Russia"
 BUL_ww1_repair_relations_with_russia_desc: "Despite the very tense current situation, we must not forget that it was following the Treaty of San Stefano that the Principality of Bulgaria was able to see the light of day. Getting closer to Russia could be favorable to us."
 BUL_ww1_join_the_entente: "Join the Entente"
 BUL_ww1_join_the_entente_desc: "The Entente seems to be in the best position to win the war, and we don't want to be absent from the peace conference they will hold. Joining the Entente will inevitably drag us into the war, which could end in a total catastrophe, but at least we would have allies to support us, wouldn't we?"
 BUL_ww1_reaffirm_our_neutrality: "Reaffirm Our Neutrality"
 BUL_ww1_reaffirm_our_neutrality_desc: ""
 BUL_revanchist_policy: "Revanchist Policy"
 BUL_revanchist_policy_desc: "With our neighbors unjustly stealing our integral lands following the Second Balkan War, revanchism is ripe in Bulgaria. And while the defeat stings, it has finally taught our Military and Government the value of being careful and opportunistic. When the chance presents itself, we must strike, and strike hard!"
 BUL_ww1_improve_relations_with_germany: "Improve Relations With Germany"
 BUL_ww1_improve_relations_with_germany_desc: "Germany is the other pillar of the Triple Alliance and one of the world's great powers. Certainly Europe's. Our relations with them must be carefully tended, like milk on the fire. Let's ensure that our Berlin embassy properly nurtures our relations with the Kaiser."
 BUL_ww1_join_the_central_powers: "Join the Central Powers"
 BUL_ww1_join_the_central_powers_desc: "We cannot consider any alliance other than the Triple Alliance. We must accept the proposal they have just made to us, and take our place by their side. Only their power will protect us from outside aggressors."
 BUL_second_balkan_victory: "Victory in the Second Balkan War"
 BUL_second_balkan_victory_desc: "Having bested Serbia in the Second Balkan War, we're now free to pursue further gains in the Balkans while none of the former League Members are in any position to stop us..."
 BUL_second_balkan_victory_tt: "§GVictory§! in §Ythe Second Balkan War§! will enable new political options."
 BUL_expansionist_policy: "Expansionist Policy"
 BUL_expansionist_policy_desc: "With our neighbors properly defeated, we're in a relative position of strength not seen since the medieval period. There are many within our Government and Military who wish to secure our Northern Flank once and for all. A decisive strike against Romania is planned, and if successful, the plan is to make them a proper satellite state."
 BUL_making_amends: "Making Amends"
 BUL_making_amends_desc: "By offering our help in other matters we can try to make the other nations of the Balkans see that we need not be their enemy"
 BUL_pact_with_montenegro: "Pact with Montenegro"
 BUL_pact_with_montenegro_desc: "Making a pact with Montenegro shouldn't be too hard,as they didn't have much reason to oppose us in the first place"
 BUL_pact_with_serbia: "Pact with Serbia"
 BUL_pact_with_serbia_desc: "Making a pact with Serbia could be a difficult task, however if we support their claims to northern Albania, and promise to help liberate the rest of the South Slavic lands we can at least offer them a consolation prize"
 BUL_pact_with_greece: "Pact with Greece"
 BUL_pact_with_greece_desc: "By promising our aid in gaining their claims in southern Albania and western Anatolia, we can align Greek interests with our own and prevent them from seeking revenge against us in the near future"
 BUL_partition_of_albania: "Partition of Albania"
 BUL_partition_of_albania_desc: "The time has come, Albania will be the unfortunate victim of our diplomatic bargaining and cease to exist"
 BUL_leader_of_south_slavs: "South Slavic Leadership"
 BUL_leader_of_south_slavs_desc: "We have cemented ourselves as leaders of the South Slavs and are in a position to lead our people together to greatness"
 BUL_tsargrad: "Tsargrad"
 BUL_tsargrad_desc: "The City of the Worlds desire is right on our doorstep and it is within our interest that we control it to ensure control over the Bosporus"

 BUL_int_defeat_in_the_great_war: "Defeat in the Great War"
 BUL_int_defeat_in_the_great_war_desc: ""
 BUL_ww1_BolshevikRevolution: "Acknowledge the Bolshevik Revolution"
 BUL_ww1_BolshevikRevolution_desc: "The Bolshevik Revolution is not going away, whether we like it or not. It would be wise to be pragmatic and recognize this new power right away to establish good relations with them."
 BUL_ww1_MarxistIdeas: "Adopt Marxist Ideas"
 BUL_ww1_MarxistIdeas_desc: "The ideals of Marx and Engels have made their way and won hundreds of thousands of people to their cause. Millions, even! We must invite officials committed to Marxist ideas into our government, as this is undeniably the path forward."
 BUL_ww1_SovietBulgaria: "Proclaim the People's Republic of Bulgaria"
 BUL_ww1_SovietBulgaria_desc: "Bulgaria will be made with its people or not at all! Now that we have established the principles of a new people's republic—based on the will of the sovereign people and direct representation—we can found a brand-new republic on this model. Let's vote right away!"
 BUL_ww1_SpreadRevolutionBosphorus: "Spread the Revolution Beyond the Bosphorus"
 BUL_ww1_SpreadRevolutionBosphorus_desc: "The wind of Revolution cannot be stopped; it must go everywhere, cross borders, win over hearts and minds, and unite the people! Let's send our speakers and activists abroad, especially to Turkey, to prepare that country to join us in our struggle!"
 BUL_int_crush_the_communists: "The Communist Menace"
 BUL_int_crush_the_communists_desc: "These Reds dream only of chaos, social and moral disorder, and anarchy! If we do nothing, they will snuff out the flame of Bulgarian freedom and destroy us to turn the country into a kolkhoz! Immediate action must be taken to curb communist influence and combat it."
 BUL_int_end_the_british_occupation: "The Communist Menace"
 BUL_int_end_the_british_occupation_desc: ""

 BUL_ww1_reorganize_the_bulgarian_army: "Reorganise the Bulgarian Army"
 BUL_ww1_reorganize_the_bulgarian_army_desc: ""
 BUL_ww1_militarize_the_nation: "Militarize the Nation"
 BUL_ww1_militarize_the_nation_desc: ""
