l_english:
 ROM_WW1_Ploiesti_oil: "Ploiesti Oil Boom"
 ROM_WW1_Ploiesti_oil_desc: "Romania sits upon a massive supply of Oil in Europe, Several Nations have rushed to invest into us which is great for our Economy however makes us more susceptible to various influences"
 ROM_WW1_germanic_influences: "German Influence"
 ROM_WW1_germanic_influences_desc: "Our Monarch Carol I and Future Monarch Ferdinand I is apart of the House of Hohenzollern, Despite our Transylvanian claims we are friendly to the Central powers and have mutual defense agreements, Thus it would be frowned upon to stab our brothers whom we have ties with"
 ROM_WW1_greater_romanian_wishes: "Dreams of a Greater Romania"
 ROM_WW1_peasant_reform: "Peasant Reform"
 ROM_WW1_greater_romanian_wishes_desc: "Despite us calling ourselves Romania we are a heavily reduced state of what should be Romania, The Russians and Bulgars alongwith the Austrians and Hungarians hold various territories that should belong to us"
 ROM_ww1_big_dreams: "Big Dreams Small Nation"
 ROM_ww1_big_dreams_desc: "In May 9 1877 Romania declared itself independent from the Ottoman Empire Beginning the modern history of Romania, Our next goal is to fully unite Romania, However Besserabia remains under Russian control as does Transylvania under the Austro-Hungarians, It is clear we must compromise and join either the Entente or Central powers if we are to recieve anything"
 ROM_ww1_authority_of_monarch: "Authority of Carol I"
 ROM_ww1_authority_of_monarch_desc: "We cannot allow the Senate to dictate the decision making of the Nation, Rather our King Carol I will decide who governs and when they have served their purpose, The Conservatives and Liberals will all answer to the King"
 ROM_ww1_authority_to_parliment: "Empower the PNL further"
 ROM_ww1_authority_to_parliment_desc: "The Parliment must take more power in order to ensure the efforts of the country go into supporting the 80% Peasant Population"
 ROM_ww1_peasant_reform: "Enact the Peasant Reform"
 ROM_ww1_peasant_reform_desc: "The time has come for the Nation to serve its citizens, No Peasant in Romania should suffer such conditions that are present of now, Let us grant our peasants a reform"
 ROM_ww1_peasant_reform_successful: "A Successful Reform"
 ROM_ww1_peasant_reform_successful_desc: "We have radically improved the lives of our Peasants! Our economic growth should surge as more opportunities have been opened up to the poor, Additionally Families will likely expand due to the better living conditions!"
 ROM_WW1_peasant_reform_success: "Successful Peasant Reform"
 ROM_ww1_orthodox_charities: "Orthodox Charities"
 ROM_ww1_orthodox_charities_desc: "The wounds of the 1907 Peasants Revolt still run deep across the Romanian countryside, We shall fund the Orthodox Church to run Community events and Soup Kitchens during these trying times"
 ROM_WW1_orthodox_funding: "Fund the Church"
 ROM_WW1_serve_in_name_of_god: "Serve the State in the name of God"
 ROM_WW1_serve_in_name_of_god_desc: "The Romanian Orthodox Church has undoubtedly grown in size, Orthodox Christianity is one of the most relevant parts of every Romanian Citizens lives, We shall serve in the name of God to protect our Christian values"
 ROM_WW1_serve_god_tt: "Deploys a Royal Guard Division"
 ROM_ww1_balkan_policy: "Our Balkan Policy"
 ROM_ww1_balkan_policy_desc: "The Ottoman Empire finds itself in hardship and turmoil in the balkan, We believe a war will soon break out thus we must take preperations to see who it benefits us to win most."
 ROM_ww1_looking_for_partner: "Seek out an Alliance"
 ROM_ww1_looking_for_partner_desc: "We will not delay the inevitable any longer, We will begin negotiating with the Entente and the Central Powers to see which alliance benefits Romania and its interests best"
 ROM_ww1_align_to_france: "Align to France"
 ROM_ww1_align_to_france_desc: "We can claim the Entirety of Transylvania if we throw in our lot with the Entente, Thus we shall scrap our secret mutual assistance pact with the Germans and Austro-Hungarians and negotiate what we can expect to get out of joining the Entente"
 ROM_ww1_align_to_germany: "Align to Germany"
 ROM_ww1_align_to_germany_desc: "Romania shall stick with Germany, Our Mutual Defensive agreements will no longer be secret and will be made public, Russia is the true threat and we must liberate Besserabia from them"
 ROM_WW1_germanic_ties: "German Ties"
 ROM_ww1_join_central_power: "Join the Central Powers"
 ROM_ww1_join_entente: "Join the Entente"
