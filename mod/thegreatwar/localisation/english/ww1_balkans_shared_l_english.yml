l_english:
 BLL_balkan_politics: "Balkan Politics"
 BLL_balkan_politics_desc: "More so than those who master warfare, those who master diplomacy stand to gain in the dynamic Balkan Peninsula. The Ottoman Empire busy with revolts and Austro-Hungarian interference. So let's keep going!"
 BLL_anti_ottoman: "Anti-Ottoman Policy"
 BLL_anti_ottoman_desc: "While we've already fought against the Ottoman Empire for our Independence, and later for some territorial gains, we should not forget that there's more that should be ours to our south. We'll have to work towards getting them back still. After all, in this turbulent era an opportunity might eventually present itself..."
 BLL_form_the_balkan_league: "Form the Balkan League"
 BLL_form_the_balkan_league_desc: "With the blessing of the Russian Empire, it seems possible that the Balkan states can put their differences aside for now to deal with other issues together."
