 SIA_arunathai_desc:0 ""
 SIA_change_flag:0 "Trairong"
 SIA_change_flag_desc:0 ""
 SIA_social_reforms:0 "Social Reforms"
 SIA_social_reforms_desc:0 ""
 SIA_reorganization_act:0 "Reorganization Act"
 SIA_reorganization_act_desc:0 "Much of our territory has been under the possession of various groups and individuals since civilization came to our humble nation. Over hundreds of years, however, much of this territory has been inefficiently laid out or used. By reorganizing the land and owners of our nation, particularly those that have been dormant, we can squeeze some of the newly displaced people into our factories."
 SIA_limited_rearmament:0 "Limited Rationing"
 SIA_limited_rearmament_desc:0 "With food shortages seemingly a fact of life in the near future, it's important that no one hogs more than their fair share of goods. Of course, with limited rationing, civilians will still be able to enjoy themselves- possibly at the expense of our military members, however."
 SIA_full_rearmament:0 "Harsh Rationing"
 SIA_full_rearmament_desc:0 "With our brave heroes actively defending the nation, they should have top priority for food and materials! Of course, the civilian population may resort to literally counting their beans and we might have a more restless population on our hands because of it, but if nothing else, our boys in uniform won't go hungry anytime soon."
 SIA_look_at_xinhai:0 "Look at Xinhai"
 SIA_look_at_xinhai_desc:0 ""
 SIA_invate_qing:0 "Support Qing Dynasty"
 SIA_invate_qing_desc:0 ""
 SIA_invate_reb_china:0 "Support Kuomintang"
 SIA_invate_reb_china_desc:0 ""
 SIA_view_as_a_case_study:0 "View as a Case Study"
 SIA_view_as_a_case_study_desc:0 ""
 SIA_help_our_friend:0 "Help Our Comrade"
 SIA_help_our_friend_desc:0 "“If you tremble with indignation at every injustice then you are a comrade of mine.” ― Ernesto Che Guevara"
 SIA_interwar_Aftermath:0 "Aftermath of Versailles"
 SIA_interwar_Aftermath_desc:0 "As the Treaty of Versailles was being signed Ferdinand Foch said “This is not Peace. It is an Armistice for 20 years”, the future will tell us if he was right..."
 SIA_russian_civil_war:0 "Russian Civil War"
 SIA_russian_civil_war_desc:0 ""
 SIA_interwar_Position_RussianCivilWar_SupportRed:0 "Fight against the White Army"
