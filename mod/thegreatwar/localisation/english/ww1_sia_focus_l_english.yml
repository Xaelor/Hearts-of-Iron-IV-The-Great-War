 SIA_help_philippines:0 "Help Philippines"
 SIA_help_philippines_desc:0 ""
 SIA_war_support:0 "War Support"
 SIA_war_support_desc:0 ""
 SIA_awake_of_white_elephant:0 "Awake of White Elephant"
 SIA_awake_of_white_elephant_desc:0 "Awake and Wrath again"
 SIA_reclaim_the_right_hand:0 "Reclaim the Right Arm"
 SIA_reclaim_the_right_hand_desc:0 "In an ancient prophecy, the reign of King Rama V will be the "Armless King" era. And it really is, because we lost a lot of territory to the United Kingdom and France. Now we will take back our arms."
 SIA_reclaim_the_left_hand:0 "Reclaim the Left Arm"
 SIA_reclaim_the_left_hand_desc:0 "In an ancient prophecy, the reign of King Rama V will be the "Armless King" era. And it really is, because we lost a lot of territory to the United Kingdom and France. Now we will take back our arms."
 SIA_challenge_the_china:0 "Challenge the China"
 SIA_challenge_the_china_desc:0 "China is a nation that we have long respected. But now let's challenge them whether the Dragon still has fangs and claws."
 SIA_pivot_to_the_past:0 "Pivot to the Past"
 SIA_pivot_to_the_past_desc:0 "For centuries we have moved to a new capital to Bangkok because the old capital had become in ruins. It has become a myth that our ancestors often told us that it was once magnificent and grand. It is time for us to rebuild that city as great as our ancestors said and dream of making it great again."
 SIA_grand_siamese_kingdom:0 "Grand Siam"
 SIA_grand_siamese_kingdom_desc:0 "In our past we used to be great and we've failed. It's been like this many times. But it won't happen again, because we will create our new history and we will learn from the past and will prevent it from happening again in the future."
 SIA_great_rattanakosin:0 "Great Rattanakosin"
 SIA_great_rattanakosin_desc:0 "In recent years we have moved away from the traditional values our nation was originally founded upon. Now that we have reached the territorial extent from our glory days, perhaps it is time to embrace our history more tightly."
 SIA_neo_anam_siam_yuth:0 "Second Annam-Siam Yuth"
 SIA_neo_anam_siam_yuth_desc:0 "In 1841, or the reign of King Rama III, we went to war with the Annamese or the Vietnamese. But in that battle, no one lost or won. But now we will re-define that war."
 SIA_revenge_of_siam_devadhiraj:0 "Revenge of Siam Devadhiraj"
