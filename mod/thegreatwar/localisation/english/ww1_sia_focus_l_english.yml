 SIA_chakkavattivatr:0 "Chakkavattivatr"
 SIA_chakkavattivatr_desc:0 "Chakkavattivatr is Emperor Codex is one of the teaching of buddhism. It's a teaching about good governance and the behavior of leaders. Which is what the Ayutthayā Kings have continued to do for the welfare of the people."
