 SIA_interwar_Position_RussianCivilWar_SupportWhite:0 "Fight against the Red Army"
 SIA_interwar_Position_RussianCivilWar_SupportWhite_desc:0 ""
 SIA_interwar_Position_TurkeyCivilWar:0 "Problem in Anatolia"
 SIA_interwar_Position_TurkeyCivilWar_desc:0 "What happened in the Bosphorus Strait? We should probably go take a look."
 SIA_interwar_Position_TurkeyCivilWar_ProGREECE:0 "Support the Greeks"
 SIA_interwar_Position_TurkeyCivilWar_ProGREECE_desc:0 ""
