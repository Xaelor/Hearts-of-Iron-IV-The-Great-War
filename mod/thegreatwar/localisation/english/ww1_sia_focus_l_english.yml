 SIA_the_struggle_of_the_oppressed:0 "The Struggle of the Oppressed"
 SIA_the_struggle_of_the_oppressed_desc:0 ""
 SIA_red_alert:0 "Red Alert"
 SIA_red_alert_desc:0 "“People of the world, the red light is about to spread to your land.”"
 SIA_support_the_vietnam_uprising:0 "Support the Vietnam Uprising"
 SIA_support_the_vietnam_uprising_desc:0 ""
 SIA_help_burma:0 "Help Burma"
