 SIA_suport_orleans:0 "Viva la Orléans"
 SIA_suport_orleans_desc:0 "King Rama V had a close relationship with Princess Marie of Orléans, who is the wife of Prince Valdemar of Denmark. By this close relationship, we will negotiate and encourage the Orléans dynasty to become King of France."
 SIA_suport_bonepartist:0 "Come Back, Bonaparte"
 SIA_suport_bonepartist_desc:0 "After fall of the Second French Empire, Napoléon III came to Siam. "
 SIA_suport_mughal:0 "Mughal's Revenge"
 SIA_suport_mughal_desc:0 "When India will be occupied by the British. Mughal Dynasty overrun. The last emperor, Bahadur Shah II was exiled to Rangoon. His sons were also shot in front of the Indian people in the downtown. The rest of the royal family had to live in hard times. Therefore, we will give them this opportunity to take revenge."
 SIA_war_game:0 "War Games"
 SIA_war_game_desc:0 ""
 SIA_march_to_gem_city:0 "March to Mueang Kaew"
 SIA_march_to_gem_city_desc:0 "“Mueang Kaew” or Gem City is a word used by King Rama IV to sarcastically use European territory. Because Europeans tend to think that their own land is civilized, but see other territories as barbarians. So we are going to visit “Mueang Kaew”, but not as a visitor."
