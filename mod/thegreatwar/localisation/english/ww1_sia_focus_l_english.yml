 SIA_military_rule_desc:0 ""
 SIA_military_youth:0 "Military Youth"
 SIA_military_youth_desc:0 ""
 SIA_paramilitarism:0 "Paramilitarism"
 SIA_paramilitarism_desc:0 ""
 SIA_reform_military_academy:0 "Reform Military Academy"
 SIA_reform_military_academy_desc:0 ""
 SIA_retake_the_teak_forest:0 "Retake the Teak Forest and Bunga Mas Garden"
 SIA_retake_the_teak_forest_desc:0 ""
 SIA_path_of_freedom:0 "Path of Freedom"
 SIA_path_of_freedom_desc:0 "When King Rama V built the Ananta Samakhom Throne Hall, he was said that “It was built as a parliament”. Therefore, he wanted this country to be a democracy like the developed countries in the west. Let's make his idea come true."
 SIA_dusit_thani:0 "True Dusit Thani"
 SIA_dusit_thani_desc:0 "In Historical, Dusit Thani was a democratic experimental city. But it's just a dollhouse. But we will develop the country to be free, right? We have to be serious about doing this."
 SIA_constitution_monarchy:0 "Constitution Monarchy"
 SIA_constitution_monarchy_desc:0 "The United Kingdom is a good example of keeping the monarchy in tandem with democracy. We will bring this idea to our country."
 SIA_compromise_with_king:0 "Compromise with King"
 SIA_compromise_with_king_desc:0 ""
 SIA_social_contract:0 "Social Contract"
 SIA_social_contract_desc:0 ""
 SIA_assasinate_king:0 "Assasinate King"
 SIA_assasinate_king_desc:0 ""
 SIA_republic:0 "Satarana Rath"
 SIA_republic_desc:0 "Viva la República!!!"
 SIA_new_ideology:0 "New Ideology"
 SIA_new_ideology_desc:0 ""
