l_english:
 focus_SIA_army_effort:0 "Army Effort"
 focus_SIA_army_effort_desc:0 "Many of our rifles, cannons, tools, and, unfortunately, military leaders are relics of a bygone era. With the Maxim Gun now not only fabricated, but on a large scale, we simply have no choice but to get with the times. The quicker we bring these new weapons into circulation, and bring in experts who know how to use them, the quicker our military can become a modern, effective fighting force."
 focus_SIA_equipment_effort:0 "Equipment Effort"
 focus_SIA_equipment_effort_desc:0 "Our generals are not the only old guard keeping our military in the last century. Our Quartermasters still have some of the 19th century Military issues behind them. By selecting the most well-liked and in-tune officers, we can learn the faults of our current weapons, allowing us to produce corrected and improved designs quickly- as well as ensure that these men don't get TOO popular!"
 focus_SIA_equipment_effort_2:0 "Equipment Effort II"
 focus_SIA_equipment_effort_2_desc:0 "Our new Quartermasters have taken to us with requests for not simply newer rifles, but newer support weapons as well. Experience with this new-pattern army has led to ideas like lighter machine guns, trench mortars, and rifle grenades, which all seem quite useful, so long as we can get the right people on designing them and manufacturing them."
 focus_SIA_equipment_effort_3:0 "Equipment Effort III"
 focus_SIA_equipment_effort_3_desc:0 "The Quartermasters have sent a letter of demands for more rifles equipped for the conditions of trenches- those able to launch rifle grenades, attach bayonets or scopes, and more carbines. Though we could simply produce more straight up, it seems like a logical move is to bring our rifles to the standard of being able to do all of these things- which means a new, improved design."
 focus_SIA_equipment_effort_4:0 "Equipment Effort IV"
 focus_SIA_equipment_effort_4_desc:0 "Our Quartermasters have, unfortunately, sent us yet another list of demands. Luckily, we have instructed our postmasters to ignore any further mail from them. Their last demand is new equipment for our Engineer corps- Carbines, tools, and those new Flamethrowers, which will be commissioned as soon as possible. Of course, expanding the Engineer corps as such could provide for some unseen benefits..."
 focus_SIA_ww1_artillery_effort_1:0 "Artillery Effort"
 focus_SIA_ww1_artillery_effort_1_desc:0 "One step to expand our young military modernization program is further development of our Artillery batteries. Seeking out designers for new weapons is a logical first step, and once our project is completed, we expect to reap the benefits of an easily-designed new Artillery piece."
 focus_SIA_ww1_artillery_effort_2:0 "Artillery Effort II"
 focus_SIA_ww1_artillery_effort_2_desc:0 "Now that we have gathered some accomplished Artillery designers, it seems logical to support their endeavors with their own factories. By assigning these men as full-time designers and engineers, and putting workers under them, we can easily make advancements in the field of Artillery."
 focus_SIA_ww1_artillery_effort_3:0 "Artillery Effort III"
 focus_SIA_ww1_artillery_effort_3_desc:0 "Field tests are proving a major issue with our artillery pieces: The wide variety of calibers we're using for various ranges and models of Artillery is proving a costly endeavor, and reducing the effectiveness of our pieces on the field. By enforcing a few standard sizes for our guns, we can produce new models of Artillery that give us, quite literally, more bang for our buck."
 focus_SIA_ww1_artillery_effort_4:0 "Artillery Effort IV"
 focus_SIA_ww1_artillery_effort_4_desc:0 "Though the direct-fire Field Gun was thought to be on its way out from the battlefield, our quartermasters are actually beginning to request even more of these pieces. Focusing our efforts on new direct-fire guns, and perhaps more types of rounds, will not only inevitably lead to superior models, but perhaps lead to some unexpected advantages elsewhere as well..."
 focus_SIA_doctrine_effort:0 "Doctrine Effort"
 focus_SIA_doctrine_effort_desc:0 "Though the era of the General Staff consisting of the princes of the realm has long ended, several of our Generals and other officers were chosen for our armeis not for skill, but for connections or family ties. Though this keeps them loyal, it makes them uncompetitive. We must begin appointments for merit- though still, hopefully, not let too much of the common riff-raff into the esteemed General Staff..."
 focus_SIA_ww1_doctrine_effort_2:0 "Doctrine Effort II"
 focus_SIA_ww1_doctrine_effort_2_desc:0 "Though our General Staff has now been made thoroughly merit-based, they aren't the only ones who can assist in our doctrines. A type of researchers who have been mostly dormant since the early 1800s- “armchair generals”- have organized once again. Though these men have limited combat experience, their study in war cannot be ignored. Integrating them could prove beneficial for our military tactics."
 focus_SIA_ww1_doctrine_effort_3:0 "Doctrine Effort III"
 focus_SIA_ww1_doctrine_effort_3_desc:0 "One of our critical elements of warfare has largely been ignored prior: Logistics. For troops to be useful in combat, we must ensure they arrive on time, and have, at least, food, water, and a weapon. Giving experts on this subject a voice, as well as training for supply vehicle drivers, would have immediate benefits for our land doctrines, but perhaps future additional benefits as well."
 focus_SIA_ww1_trenchwarfare:0 "Trenchwarfare"
 focus_SIA_ww1_trenchwarfare_desc:0 "Since Gatling and Maxim introduced their unholy weapons of warfare, our nation has been keenly interested in strategies based around the defense of Trench lines, which were first seen as far back as the American Civil War. We must seek experts in this theory in order to advance our knowledge in tomorrow's Land Doctrines."
 focus_SIA_ww1_gasmask_focus:0 "Gasmask Focus"
 focus_SIA_ww1_gasmask_focus_desc:0 "Some of our chemists have proposed the use of a new, incredibly deadly agent- poisonous gas, delivered by our artillery and trench mortars. Though chemical warfare has been frowned on for roughly a century, what choice do we have if we are to win the war? Beyond investing in these, it's also likely for the best to develop countermeasures quickly- it would be unfortunate for such an advancement to turn on us!"
 focus_SIA_ww1_special_forces:0 "Special Forces"
 focus_SIA_ww1_special_forces_desc:0 "Chemical Warfare has, by sheer accident, introduced us to a class of excellent troops, superior to the other groups in our army. These men seem quite useful to act as classes of Infantry which are above the caliber of the standard Rifleman. Seeking out these men could lead to a boost to our special forces. If only there were some way to get them into battle faster..."
 focus_SIA_ww1_army_motorization_focus:0 "Army Motorization Focus"
 focus_SIA_ww1_army_motorization_focus_desc:0 "Some of our geniuses in the General Staff- or perhaps just men fed up with the stalemates of Trench Wafare- have proposed mass-producing vehicles specifically for troop transportation, which would allow our men to get to and from battlefields faster- and, perhaps, around it as well. Of course, even this simple act requires specific equipment and training, which means an investment- though one that could easily pay off."
 focus_SIA_ww1_armored_car_focus:0 "Armored Car Effort"
 focus_SIA_ww1_armored_car_focus_desc:0 ""
 focus_SIA_ww1_armor_effort_1:0 "Armor Effort"
 focus_SIA_ww1_armor_effort_1_desc:0 "Our prior investments have paid off! Artillery designers, Engineers, and vehicle designers have proposed to us a brand new type of vehicle- a heavily armored tractor with a direct fire gun. Though early designs are clearly not battle ready, this concept has strong promise- particularly in the field of ending the Trench stalemate in our favor, if these landships can stand up to machine gun fire, as is claimed."
 focus_SIA_ww1_armor_effort_2:0 "Armor Effort II"
 focus_SIA_ww1_armor_effort_2_desc:0 "Our experiments with armor have been a rousing success! However, we cannot be complacent with our current designs. Engineers have been proposing interesting concepts like rotating gun turrets, specific engine compartments, and a hatch for use by a commander, which cannot be ignored. If we are to be the first to make these ideas a reality, perhaps we could become unstoppable!"
 SIA_ww1_diplomatic_effort:0 "Diplomatic Effort"
 SIA_ww1_diplomatic_effort_desc:0 "It is becoming increasingly difficult to stay in the middle of the affairs in the world as it stands. Our diplomatic corps is already asking if we're to be involved in the coming power struggle, or if we are to stay out of things entirely. While we can't answer that question quite yet, we can easily expand our corps to be able to choose one of these options."
 focus_SIA_ww1_takeposition:0 "Take Position"
 focus_SIA_ww1_takeposition_desc:0 "Our place in the world is tenuous at best. After all, with the great empires at each others' throats, what's to stop one from turning on us once they're through? We must bet on the winning horse, and quickly, to ensure ourselves a place at the council of victors instead of as a footnote in a history book."
 focus_SIA_ww1_supportfrance:0 "Support France"
 focus_SIA_ww1_supportfrance_desc:0 "Though France's industry can't compete with Germany's, they have far more friends, and we'd even be one more. By supporting France on in a few of the upcoming diplomatic issues, we may just win them over."
 focus_SIA_ww1_supportrussia:0 "Support Russia"
 focus_SIA_ww1_supportrussia_desc:0 "The Russian Empire is in pretty dire need of international help. For the nation whose former leader coined the term “Sick Man of Russia”, they cannot be particularly healthy themselves. Our support will, if nothing else, help them hang on long enough to do something decisive."
 focus_SIA_ww1_supportgermany:0 "Support Deuschland"
 focus_SIA_ww1_supportfrance_desc:0 "With the German Empire's massive industrial sector, they seem to be the clear-cut bet, even if they are diplomatically isolated. Showing public support to the Germans on even a few, non-key matters will send a message that we're moving closer to the Central Powers."
 focus_SIA_ww1_supportaustria:0 "Support Austria-Hungary"
 focus_SIA_ww1_supportaustria_desc:0 "The old empire of Austria-Hungary has lived to see the rise of most of the major nations on the world map. So, surely, if we want to become seen as a more major nation, what better country to support? This will also help us draw closer to the Central Powers."
 SIA_neutrality_focus:0 "Neutrality Focus"
 SIA_neutrality_focus_desc:0 ""
 focus_SIA_ww1_military_reserve:0 "Military Reserve"
 focus_SIA_ww1_military_reserve_desc:0 "War could easily come to our borders at a moment's notice, and therefore, we have to be prepared for the worst. A Military Reserve of loosely trained conscripts will be of little true value in the case of a war, but these impressionable young men getting a taste of the army life may very easily convince them to join the real thing."
 focus_SIA_deterrence:0 "Deterrence"
 focus_SIA_deterrence_desc:0 ""
 focus_SIA_interventionism_focus:0 "Interventionism Focus"
 focus_SIA_interventionism_focus_desc:0 ""
 focus_SIA_volunteer_corps:0 "Volunteer Corps"
 focus_SIA_volunteer_corps_desc:0 ""
 focus_SIA_foreign_expeditions:0 "Foreign Expeditions"
 focus_SIA_foreign_expeditions_desc:0 ""
 focus_SIA_ww1_embargo_france:0 "Sanction France"
 focus_SIA_ww1_embargo_france_desc:0 "France's diplomatic scheming and backstabbing are unforgivable! Though a sanction will make us appear and act far less neutral in the war situation, it's unlikely to spiral into anything bad, and more importantly, will ensure France cannot take advantage of us!"
 focus_SIA_ww1_embargo_germany:0 "Sanction Germany"
 focus_SIA_ww1_embargo_germany_desc:0 "Germany's illegal Submarine attacks are an insult to free trade! Though a sanction will draw us slightly further from neutrality, it will make us far harder to exploit by the merchants of the German Empire."
 focus_SIA_ww1_sellweapons:0 "Sell Weapons"
 focus_SIA_ww1_sellweapons_desc:0 "Though the tension of the world is the highest it's ever been, even this stormcloud has a silver lining. As we have no interest in joining the fight, we can easily hawk our weapons and weapon designs- even to both sides of a conflict, if we want- and make a killing off of the misfortunes of others. Their fault for starting the war."
 focus_SIA_ww1_appeasement:0 "Appeasement"
 focus_SIA_ww1_appeasement_desc:0 "Sometimes, flattery is the best way to save your own skin. Appeasing the larger powers is no prestigous action to have in your playbook, but if used at the right time, simply giving another nation what it wants can be a far lot safer than seeing what happens if you don't...so long as you remember to draw the line somewhere."
 focus_SIA_ww1_aggressive_foreign_policy:0 "Aggressive Foreign Policy"
 focus_SIA_ww1_aggressive_foreign_policy_desc:0 "Actually, you know what? On second thought, Neutrality is boring. To hell with it. We're ready to get involved in this war, and we're gonna come out swinging!"
 focus_SIA_ww1_joinfrance:0 "Join Entente"
 focus_SIA_ww1_joinfrance_desc:0 "The Entente currently seem to be in the better position to win the war, and we wouldn't want to be caught missing the peace conference once they do. Joining the Entente will definitely pull us into war, which could wind up disastrously, but at least we'll have allies to help, right?"
 focus_SIA_ww1_joingermany:0 "Join Central Power"
 focus_SIA_ww1_joingermany_desc:0 "The Central Powers have long been a friend to our nation, and desperately need help in these most uncertain times. Joining them is a one-way ticket into the war on their side, and we better be in it to win it if we are, but we could turn the tides to a decisive victory on their part."
 focus_SIA_ww1_war_effort:0 "War Effort"
 focus_SIA_ww1_war_effort_desc:0 "With the world in its current state, we can't afford to let other nations pass over our military. By expanding our industrial base, we can ensure we'll have enough guns and shells to come out on top."
 focus_SIA_technology_sharing:0 "Technology Sharing"
 focus_SIA_technology_sharing_desc:0 ""
 focus_SIA_ghost_soldier:0 "Ghost Soldier"
 focus_SIA_ghost_soldier_desc:0 ""
 focus_SIA_infrastructure_effort:0 "Infrastructure Effort"
 focus_SIA_infrastructure_effort_desc:0 ""
 focus_SIA_industrial_effort:0 "Industrial Effort"
 focus_SIA_industrial_effort_desc:0 ""
 SIA_lost_of_the_belove_king:0 "Lost of the Belove King"
 SIA_lost_of_the_belove_king_desc:0 "“Phra Piya Maharaj” or The Great Belove King is the nickname of King Rama V. But now, he has passed away. It made the people of Siam very sad. Therefore, may all of you come to mourn and send him to heaven."
 SIA_accesion:0 "Accession"
 SIA_accesion_desc:0 "King Rama V made a great contribution to the country. Therefore, it is a heavy burden for those who will take over. It's time for us to inherit his will. or whether to change."
 SIA_foreign_focus:0 "Foreign Focus"
 SIA_foreign_focus_desc:0 ""
 SIA_walk_our_way:0 "Walk Our Way"
 SIA_walk_our_way_desc:0 "Why should we only follow the Western powers even though we can determine our own destiny?"
 SIA_feet_cleaning_peper:0 "Feet Cleaning Peper"
 SIA_feet_cleaning_peper_desc:0 "This treaty has taken advantage of us in many ways. We took it to wipe the feet, should be more useful."
 SIA_bowringtreatyoffer:0 "Bowring Treaty Offer"
 focus_SIA_bowringtreatyoffer_desc:0 "This treaty has taken advantage of us in many ways. We will have to negotiate to fix it."
 SIA_home_defend:0 "Home Defense"
 SIA_home_defend_desc:0 "Even if we don't go to war with anyone. But can we trust that no one will knock on our door while we are reading stories to our children?"
 SIA_media_neutral:0 "Media Neutral"
 SIA_media_neutral_desc:0 "In this brutal war We are not affiliated. But this is a great war that people around the world are watching. Why don't we make news about this war?"
 SIA_warpropaganda:0 "Rush to the War"
 SIA_warpropaganda_desc:0 "Time to Fight!!!"
 SIA_go_left:0 "Go Left"
 SIA_go_left_desc:0 "For freedom, come this way"
 SIA_go_right:0 "Go Right"
 SIA_go_right_desc:0 "For stability, come this way."
 SIA_palace_revolt:0 "Palace Revolt"
 SIA_palace_revolt_desc:0 "The king is an obstacle to the prosperity of this country. So we will revolution."
 SIA_coronation_ceramonyt:0 "Coronation Ceramony"
 SIA_coronation_ceramonyt_desc:0 ""
 SIA_absolute_monarchy:0 "Sompuranayasiddhiraj"
 SIA_absolute_monarchy_desc:0 "When we choose to carry the heavy burden after King Rama V, we must carry on with his will. which he has laid a good foundation."
 SIA_wild_tiger_corpe:0 "Wild Tiger Corpe"
 SIA_wild_tiger_corpe_desc:0 ""
 SIA_dusit_samit:0 "Dusit Samit"
 SIA_dusit_samit_desc:0 "“What country has no perfect poets. That country would be humiliated.” Promotion of literary works It encourages people in the country to have a better education. This will make our country easier to develop."
 SIA_government_savings_bank:0 "Thanakharn Ormsin"
 SIA_government_savings_bank_desc:0 "“Thanakharn Ormsin” or “Government Savings Bank”, King Vajiravudh (Rama VI) introduced a means to save money to Thailand in 1913. His purpose was to introduce Thai people to banking services and to promote a habit of thrift and saving. King Vajiravudh issued an act, effective 1 April 1913, to formally set up a “Savings Office” which began its operations under the Royal Treasury."
 SIA_buddhist_traditions:0 "Buddhist Traditions"
 SIA_buddhist_traditions_desc:0 "Most of the population of our country often believe in Buddhism and respected for many centuries. Therefore, we will promote Buddhism as the main religion of the country."
 SIA_one_king_one_rule_one_land:0 "One King, One Rule, One Land"
 SIA_one_king_one_rule_one_land_desc:0 ""
 SIA_militarism:0 "Coup d'état"
 SIA_militarism_desc:0 "This King, after reigning from the reign of King Rama V, was not very interested in the administration of the country. Only interested in poetry and drama, and spent a lot of money on them. If left like this Our country may have problems that are difficult to solve in the future."
 SIA_change_king:0 "Change King"
 SIA_change_king_desc:0 "We should give the crown and throne to the better suitable."
 SIA_military_reform:0 "Military Reform"
 SIA_military_reform_desc:0 ""
 SIA_design_equipment_standards:0 "Design Equipment Standards"
 SIA_design_equipment_standards_desc:0 ""
