 SIA_aviation_effort:0 "Aviation Effort"
 SIA_aviation_effort_desc:0 "Now that we have formally established an Air Force, we have made some interesting advances. Most notably, our aircraft designers have been proposing designs for specific roles, rather than simply arming generic models. Getting effective use out of these planes, designed with roles like attacking enemy aircraft or dropping bombs in mind, will require testing and research, but may prove beneficial."
 SIA_aviation_effort_2:0 "Aviation Effort II"
 SIA_aviation_effort_2_desc:0 "Our efforts to create aircraft roles have resulted in a variety of vastly different aircraft, which do vastly different things. The Fighter class of aircraft in particular has attracted a great amount of youth to aircraft, some of whom are quite adept already, who have some interesting ideas for the future of our air force. Perhaps we should gather some of their ideas, for the good of our doctrines."
 SIA_ww1_airship_focus:0 "Airship Focus"
 SIA_ww1_airship_focus_desc:0 "The Balloon is our oldest aircraft, and experts are predicting that it may not have a long future on the battlefield. This is no excuse to ignore the designs of such craft, especially when they may still be an effective way to deliver large bomb payloads. By bringing out-of-work Zeppelin manufacturers under the state's wing, we could squeeze the most out of this design while we still can."
 SIA_fighter_focus:0 "Fighter Focus"
 SIA_fighter_focus_desc:0 "The value of the Fighter is unquestionable. If we focus our aviation efforts on the design and use of these aircraft, our nation's planes may one day flood the sky, destroying all enemy planes that even try to oppose them, which could provide a major advantage. Of course, the Bomber lobby has interesting proposals as well, so perhaps we should not put all of our eggs into one basket..."
 SIA_bomber_focus:0 "Bomber Focus"
 SIA_bomber_focus_desc:0 "The Bomber is a simple, practical machine. Focusing our production and designers on this specific class of aircraft would be a good way to ensure that we can use the Air Force as a ground support tool, able to help the infantry gain ground by destroying enemy defenses and positions. Of course, fighters should still be produced, but these bombers may win us the war."
 SIA_ww1_aviation_effort_3:0 "Aviation Effort II"
 SIA_ww1_aviation_effort_3_desc:0 "Our efforts to create aircraft roles have resulted in a variety of vastly different aircraft, which do vastly different things. The Fighter class of aircraft in particular has attracted a great amount of youth to aircraft, some of whom are quite adept already, who have some interesting ideas for the future of our air force. Perhaps we should gather some of their ideas, for the good of our doctrines."
 SIA_ww1_pilotformation_1:0 "Pilot Formation"
 SIA_ww1_pilotformation_1_desc:0 "Currently, Aircraft fly solo- distant from each other, and engaging in one-on-one duels with any enemies they might encounter. However, with more and more machines in the sky, it's clear that this is no longer the most viable way to engage in air combat. Some of our physicists may be valuable in helping us to determine new formations for our pilots to use."
 SIA_ww1_aircraftprod_1:0 "Aircraft Production"
 SIA_ww1_aircraftprod_1_desc:0 "Though Engineers have been making aircraft for us loyally, it is simply time to introduce factories outright to the concept. Putting planes into mass production will help us flood the sky with friendly craft- and, more importantly, help us deprive our enemies of the same advantage. Who knows? Maybe some of these factory engineers may have some good ideas for aircraft designs..."
 SIA_ww1_airbomb_1:0 "Air Bombing Effort"
 SIA_ww1_airbomb_1_desc:0 "While the tactics of our fighters are improving with formations, our bombers are still very basic machines with very basic doctrines. Some of our old airship bombers possess now essentially unused expertise, which could help the latter as time solves the former. By utilizing these men, we can ensure that the old lessons of bombing are not lost on newer craft."
 SIA_ww1_aviation_effort_4:0 "Aviation Effort IV"
 SIA_ww1_aviation_effort_4_desc:0 "Our Air Force, which was established only recently, has now integrated itself completely into our armed forces. This brings us the obvious benefit of a pool of aviation experts, as well as a new class of “Ace” pilots, who are even becoming minor celebrities. Hiring on these people certainly can't hurt us, and will lead to nice developments in our field."
 SIA_ww1_pilotformation_2:0 "Pilot Formation II"
 SIA_ww1_pilotformation_2_desc:0 "The new formations we have established have indeed been a boon to us in combat. However, ensuring people stick to the formations is a different story entirely. Encouraging our top aces to put out a manual for our pilots on air tactics and formation will ensure our pilots stick to doing what's best- and perhaps, these sorts of writings will help spread new tricks and doctrines."
 SIA_ww1_aircraftprod_2:0 "Aircraft Production II"
 SIA_ww1_aircraftprod_2_desc:0 "While Aircraft have been produced at factories dedicated to vehicle production, specific manufacturies dedicated specifically to planes themselves have been established. Usually commandeered by experts, these new industries will most certainly help us in coming up with new designs, and streamlining those existing."
 SIA_ww1_airbomb_2:0 "Air Bombing Effort II"
 SIA_ww1_airbomb_2_desc:0 "One of the biggest issues with our air force currently is the fact that bombing is, for the most part, a guessing game, with the required geometrical calculations simply not viable methods mid-flight. With not just doctrine, but also standardized equipment and training for its use, we can turn bombing from a mildly threatening game of chance to a precise and deadly science."
 SIA_ww1_aviation_effort_5:0 "Aviation Effort V"
 SIA_ww1_aviation_effort_5_desc:0 "With the development of brand new types of aircraft, such as the Tactical and Strategic Bomber, we have yet more testing and theorycrafting to do on exactly the best way to get use out of this influx of new models. Some are already speculating that bombers may be a wonder weapon capable of deciding a war. What poppycock!"
 SIA_ww1_air_innovation:0 "Air Innovation Focus"
 SIA_ww1_air_innovation_desc:0 "All of the recent developments to air warfare, both in theory and in practice, have given birth to a golden age of aircraft development. From pilots down to the plane mechanics, it seems that everyone has something to improve and potentially offer, which we can use on a national level. Perhaps one day, Aircraft may be the most important weapon in war...nah, probably not."
 SIA_ww1_air_innovation:0 "Naval Bombing Effort"
 SIA_ww1_air_innovation_desc:0 "One of our aspiring, mid-level air officers recently displayed the conclusion of a project he had been working on in secret. A seaplane was launched from a static ship, dropped a bomb onto one of our old scrappers, sinking the poor old vessel. Though most of our high command was unimpressed, attention from the head of state could certainly give this ambition a boost."
 SIA_naval_effort:0 "Modernize the Navy"
 SIA_naval_effort_desc:0 "Combustion-powered ships have begun to shine above their contemporaries, and have heralded yet another new era of naval warfare. Huge ships with equally large guns fighting at incredible engagement ranges is slated to be the order of the day. Due to this, a modernization program for our ships, as well as training in the new ways of warfare for our officers, is most certainly in order."
 SIA_ww1_newnavalcanons_1:0 "Naval Gun Effort"
 SIA_ww1_newnavalcanons_1_desc:0 "While our ship designs themselves are constantly evolving, we cannot forget about the guns aboard our vessels. Though we've been standardizing calibers for over a century now, we still have far too many different variable gun sizes for far too many roles. By cutting the total amount of standards, and making each type of gun more general-purpose, we can streamline ship design."
 SIA_ww1_dreadnought_effort:0 "Dreadnought Effort"
 SIA_ww1_dreadnought_effort_desc:0 "Since the British first unveiled the Dreadnought-class, an arms race has been in progress between the major navies of the world to produce the biggest, best battleships. If our country is to stay relevant in today's naval war, we must bring out improved designs for these ships of our own."
 SIA_ww1_newnavalcanons_2:0 "Naval Gun Effort II"
 SIA_ww1_newnavalcanons_2_desc:0 "Though we have now solved the problems of the guns themselves, we must also stay up to date with equipment that supports our naval batteries. Rangefinders are starting to become a common feature of our ships, and ensuring that our officers know how to use it, especially compared to our guns' maximum effective range, will make battling a much smoother process, and help us get more use out of our newer, better guns."
 SIA_flexible_navy:0 "Flexible Navy"
 SIA_flexible_navy_desc:0 "A great mass of ships is of no use to us if they're only patrolling a very small amount of the ocean. Building a fleet which can go anywhere, any time it's needed, with large amounts of screens supported by decent numbers of Battleships and Dreadnoughts, could help us control more of the sea and respond to a larger variety of threats, allowing us to project power all across the world."
 SIA_ww1_large_navy:0 "Large Navy"
 SIA_ww1_large_navy_desc:0 "Having just Battleships and Dreadnoughts would be formidible on its own, but also creating a solid core of screens and battlecruisers can easily tip the seas in our favor from both the tactical options such crafts give us, as well as sheer number. If we build around this concept and study the doctrine to match, our fleet may just become unbeatable."
 SIA_submarine_effort:0 "Submarine Effort"
 SIA_submarine_effort_desc:0 ""
 SIA_cruiser_effort:0 "Cruiser Effort"
 SIA_cruiser_effort_desc:0 "Our admirals desire a larger amount and investment in Cruisers, to give us medium-sized ships good for harassing smaller vessels, enemy cargo ships, and supporting larger warships. Sending out for shipwrights to propose and build advanced designs of this ship class will help us against any enemy with a large, Destroyer-focused fleet, and help our Submarines stay out of danger."
 SIA_destroyer_effort:0 "Destroyer Effort"
 SIA_destroyer_effort_desc:0 "Our admirals have requested a larger amount and investment in Destroyers, to give us light ships good for taking out submarines, scouting for the rest of the fleet, and escorting Convoys. Ordering more and better Destroyers in our dockyards will help us keep our trade routes open, and Submarines well out and away."
 SIA_capital_ships_effort:0 "Capital Ship Effort"
 SIA_capital_ships_effort_desc:0 "Our admirals have given a simple demand: More of these amazing Dreadnoughts, and bigger and better ones as well. Constructing these behemoth ships will help us take control of the waters, give fire support to troops fighting on the shores, and protect our naval invasions to start with."
 SIA_ww1_newnavalcanons_3:0 "Naval Gun Effort III"
 SIA_ww1_newnavalcanons_3_desc:0 "Analogue Fire Control is making a splash in the naval community, for its ability to guide all guns of a ship onto the same rough target. While still relatively primitive, obviously ship and gun designs with the ability to utilize such a feature are already in high demand. These new designs can further give us a techonological edge on the sea."
 SIA_ww1_navyreform:0 "Navy Deployment"
 SIA_ww1_navyreform_desc:0 "It is not simply guns and ships that win a naval battle. The best vessel in the world is no good if it's not on the sea at the right time and at the right place. Investing in more direct communication channels both ship-to-ship and ship-to-port can help us ensure that a ship will be at precisely the right place at precisely the right time, assisting in our attempts at naval supremacy."
 SIA_ww1_carrier_focus:0 "Carrier Focus"
 SIA_ww1_carrier_focus_desc:0 "A few radical minds have proposed a nearly unarmed ship, simply used for hosting an array of naval bombers. This is a very promising project, even if it is a bit hindered by the technology of today. If we are to pursue this project, perhaps planes will one day become a common sight even over the waters."
 SIA_ww1_antisubmarine:0 "Anti-Submarine Warfare"
 SIA_ww1_antisubmarine_desc:0 "Submarines are a tricky vessel to catch, particularly when well-commandeered. If we don't intend to let all of our incoming cargo ships sink to the bottom of the ocean, our admirals have advised us to begin investing in depth charges, advanced torpedos, and other weapons that might be able to take out the unseen menace."
 SIA_ww1_airfield_expansion_1:0 "Airfield Expansion"
 SIA_ww1_airfield_expansion_1_desc:0 "Airfields have the luxury of only requiring an open stretch of land near a road network. Establishing fields here is work in itself, but could pay off."
 SIA_construction_effort:0 "Construction Effort"
 SIA_construction_effort_desc:0 "A foreign company from a nearby neutral nation has been acquired in a merger with one of our national industries. If we encourage the new branch to move their factories and jobs to our country, we will see an immediate boost to our Civilian manufacturing sector. Of course, we'll have to cover the construction of the new plants..."
 SIA_production_effort:0 "Armament Effort"
 SIA_production_effort_desc:0 "The amount of weapons we have been purchasing has attracted the eye of a local Steel magnate, who wants to start a new firearm manufacturing company in our nation. If we sponsor this endeavor, by helping him acquire land, investors, and talent, we will reap the obvious benefit of a brand new Military factory."
 SIA_ww1_dockyard_effort_1:0 "Dockyard Expansion"
 SIA_ww1_dockyard_effort_1_desc:0 "By purchasing unused or underused seaside land and expanding on our existing infrastructure, we can expand our ship manufacturing capabilities."
 SIA_infrastructure_effort_2:0 "Infrastructure Effort II"
 SIA_infrastructure_effort_2_desc:0 "With our industries, dockyards, and airstrips continuing to expand, there is still more to invest in. Currently, the logical step forward is railways, which we have largely ignored up to now. Investing to modernize these will help move supplies and men, as well as open up new areas to invest in our economy."
 SIA_ww1_airfield_expansion_2:0 "Airfield Expansion II"
 SIA_ww1_airfield_expansion_2_desc:0 "Some of the civilian airstrips from the days before military aviation are still around and mostly abandoned. We could buy them up for next to nothing, and use them for our own means."
 SIA_construction_effort_2:0 "Construction Effort II"
 SIA_construction_effort_2_desc:0 "Sometimes, even in a free market, the state must become involved. If we are to start new companies on the Government's budget, and build up new factories appropriately, we can ensure that we stay competitive and independent of foreign products in a time when trade might become more and more difficult."
 SIA_production_effort_2:0 "Armament Effort II"
 SIA_production_effort_2_desc:0 "A car company which has been previously making military-grade vehicles for us is showing interest in creating a brand new factory simply for military production, in order to retain its ability to supply to the Civilian market. If we spring for construction of this plant, we could negotiate an exclusivity deal, which would simply mean a direct increase in our military equipment output."
 SIA_ww1_dockyard_effort_2:0 "Dockyard Expansion II"
 SIA_ww1_dockyard_effort_2_desc:0 "Merchant sailors, Fishermen, and retired sailors from our own navy can use their talents from the sea to oversee brand new docks."
 SIA_infrastructure_effort_3:0 "Infrastructure Effort III"
 SIA_infrastructure_effort_3_desc:0 "With the threat of a great war, we must continaully invest in construction projects, to ensure our troops have the nicest looking railroads in the world."
 SIA_oil_production_effort:0 "Oil Production"
 SIA_oil_production_effort_desc:0 ""
 SIA_extra_tech_slot:0 "Extra Research"
 SIA_extra_tech_slot_desc:0 "With a greatly expanded industrial sector and several of our country's leading minds at the helms of new manufacturies of both military and civil R&D inevitably will result. Some of the industries we have prior supported have produced and exposed some keen-minded individuals, who can develop interesting new technologies for our nation."
 SIA_ww1_airfield_expansion_3:0 "Airfield Expansion III"
 SIA_ww1_airfield_expansion_3_desc:0 "Establishing proper airstrips near major cities can create easily supplied bases able to protect some of our most valuable areas."
 SIA_construction_effort_3:0 "Construction Effort III"
 SIA_construction_effort_3_desc:0 "Our Civilian Industrial expansion is nearly complete, but there's still more that we can do. Some extra land inside of a city we own can be sold to one of our corporations, under the agreement that they'll build a factory there. This will even further increase our Civilian goods output, and leave us with few options for more beyond simple construction."
 SIA_production_effort_3:0 "Armament Effort III"
 SIA_production_effort_3_desc:0 "An Airplane designer and mechanic has approached us with a request to help him set up a brand new factory to produce his planes for our nation's air force. While he's not particularly tested, if worst comes to worst we can just have his factory produce our old designs instead. Funding his plant and helping him establish a new company will increase our military industrial capacity."
 SIA_ww1_dockyard_effort_3:0 "Dockyard Expansion III"
 SIA_ww1_dockyard_effort_3_desc:0 "Some of our old commercial docks just aren't seeing much action anymore. With just a little refurbishing and investment, these could be easily converted for military use."
 SIA_infrastructure_effort_4:0 "Infrastructure Effort IV"
 SIA_infrastructure_effort_4_desc:0 "Some civil engineers have proposed a very ambitious Highway system, designed to connect more directly some of our major cities and even military centers. Investing in this project will make our infrastructure the envy of the world! All roads shall lead to our capital!"
 SIA_extra_tech_slot_2:0 "Knowlage is Power"
 SIA_extra_tech_slot_2_desc:0 "Our great investment in infrastructure and industry has made our country smaller- not on the map, thank god, but in the sense of bring everyone together. Some bright minds from more obscure parts of our nation are visiting our capital more often, and it would not be particularly difficult to get them in the service of our nation."
