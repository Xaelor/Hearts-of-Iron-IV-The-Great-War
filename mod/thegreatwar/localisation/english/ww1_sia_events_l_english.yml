 ww1_siam.1.a:0 "The King is dead, long live The King"
 ww1_siam.1.d:0 "King Chulālongkorn died on 23 October 1910 of kidney disease at the Amphorn Sathān Residential Hall in the Dusit Palace, and was succeeded by his son Vajirāvudh (King Rāmā VI)."
 ww1_siam.1.t:0 "King Chulālongkorn dies"
 ww1_sia_news.1.t:0 "King Chulālongkorn dies"
 ww1_sia_news.1.d:0 "King Chulālongkorn (King Rāmā V) was the fifth monarch of Siam under the House of Chakri. His reign was characterised by the modernisation of Siam, governmental and social reforms, and territorial concessions to the British and French. As Siam was surrounded by European colonies, Chulālongkorn, through his policies and acts, ensured the independence of Siam. All his reforms were dedicated to ensuring Siam's independence given the increasing encroachment of Western powers, so that Chulālongkorn earned the epithet Phra Piya Mahārāt (The Great Beloved King). \n\nAnd now, King Chulālongkorn died on 23 October 1910 of kidney disease at the Amphorn Sathān Residential Hall in the Dusit Palace, and was succeeded by his son Vajirāvudh (King Rāmā VI)."
 ww1_sia_news.1.a:0 "He is in the heart forever."
