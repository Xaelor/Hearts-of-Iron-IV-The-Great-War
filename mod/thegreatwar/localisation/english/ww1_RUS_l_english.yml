 RUS_persian_cossacks: "Reinforce the Persian Cossack Brigade"
 RUS_persian_cossacks_desc: "The Persian Cossack Brigade was a Cossack-style cavalry unit formed in 1879 in Persia. It was modelled after the Caucasian Cossack regiments of the Imperial Russian Army."

