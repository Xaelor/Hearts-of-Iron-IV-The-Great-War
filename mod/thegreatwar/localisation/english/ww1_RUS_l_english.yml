 RUS_WIP: "NAME"
 RUS_WIP_desc: ""

 ww1_russia.1.t: "A New Name for Saint Petersburg?"
 ww1_russia.1.d: "Saint Petersburg, the glorious capital of Imperial Russia, has a long and prestigous history. However, its Russian name of Saint Petersburg has too much German influence. ''Petrograd'', conversely, is as Russian as Fish Pirogi! Hopefully, the new name will catch on."
 ww1_russia.1.a: "Change to Petrograd!"
 ww1_russia.1.b: "We have other things to do"
 ww1_russia.2.a: "Sounds interesting!"
 ww1_russia.2.b: "Sounds expensive."
 ww1_russia.2.d: "The Sikorsky Ilya Muromets, designed by Igor Sikorsky himself, seems to be a capable platform for a revolutionary new concept- a Four-Engine Bomber. Though expensive and uncertain, this could be a great weapon to use in the course of the war. Should we outfit these aircraft for this, or simply rely on the good old zeppelins and twin-engines?"
 ww1_russia.2.t: "Sikorsky Ilya Muromets"
 ww1_russia.3.t: "Rasputin Murdered!"
 ww1_russia.3.d: "Rasputin, healer and confidant of the Tsarina as well as one of the top advisors to the Tsar himself, has been killed by Prince Yusupov. He didn't go easy- it took 6 shots for him to go down- but he is dead nontheless."
 ww1_russia.3.a: "We must avenge him!"
 ww1_russia.4.t: "Bolsheviks Overthrow the Russian Government!"
 ww1_russia.4.d: "The Bolsheviks went on the offensive and captured the residence of the Provisional Government - the Winter Palace. All remaining ministers were arrested, and the defenders of the Palace voluntarily surrendered after a large-scale assault. The flame of socialism flared up throughout Russia revolution, which echoes loudly throughout the world. However, the scattered troops controlled by the Provisional Government are ready to fight back against the Soviets, which many may not agree with. Perhaps if Vladimir Lenin manages to defeat his opponent, can we talk about the beginning of a world revolution?"
 ww1_russia.4.a: "What happens now?\n(play as Russia)"
 ww1_russia.4.b: "What happens now?\n(play as Soviets)"
 ww1_russia.4.c: "What happens now?"
 ww1_russia.5.t: "The October Revolution is Crushed"
 ww1_russia.5.d: "Thar Nikolai II was forced into official abdication. With the October Revolution crushed, Tsarists have regained control on the Russian Empire and are now organizing the transition to bring back the rightful Tsar Nikolai II in power."
 ww1_russia.5.a: "The Tsar Rules Again"
 ww1_russia.6.t: "Treaty of Brest-Litovsk"
 ww1_russia.6.d: "Due to a combination of political instability, defeats in battle, and war weariness, we can no longer stand up to the Central Powers. A peace treaty has been drafted in Brest-Litovsk, which allows us to completely annul our Entente membership and exit the war at the cost of free Finnish, Ukrainian, Caucasian, Baltic, and Belarussian states, as well as typical war indemnities to the victorious powers. A terrible peace, but far better than the alternative."
 ww1_russia.6.a: "Russia lives in its darkest hour"
 ww1_russia.7.t: "Troops Head Home"
 ww1_russia.7.d: "After the treaty of Brest-Litovsk, most soldiers simply abandoned their posts and went home. Many of our troops have disbanded, with no central authority remaining to keep them fed and paid."
 ww1_russia.7.a: "Very well"
 ww1_russia.8.t: "Honour the Brest-Litovsk Treaty"
 ww1_russia.8.d: "We must honour the Brest-Litovsk Treaty we signed with the Central Powers and release the Baltics Countries"
 ww1_russia.8.a: "Do it"
 ww1_russia.9.t: "Honour the Brest-Litovsk Treaty"
 ww1_russia.9.d: "We must honour the Brest-Litovsk Treaty we signed with the Central Powers and give some of our western territories to the German Empire and cede Bessarabia to Romania."
 ww1_russia.9.a: "Do it"
 ww1_russia.10.t: "Honour the Brest-Litovsk Treaty"
 ww1_russia.10.d: "We must honour the Brest-Litovsk Treaty we signed with the Central Powers and release Ukraine."
 ww1_russia.10.a: "Do it"
 ww1_russia.20.t: "The Russian Civil War"
 ww1_russia.20.d: "The Russian Civil War, which broke out shortly after the revolution, brought death and suffering to millions of people. The war was fought mainly between the Red Army, consisting of the uprising majority led by the Bolshevik minority, and the Whites — army officers and cossacks, the bourgeoisie, and political groups ranging from the far Right to the Socialist Revolutionaries who opposed the drastic restructuring championed by the Bolsheviks. The Whites had backing from nations such as Great Britain, France, USA and Japan, while the Reds sported internal, domestic support which proved to be much more effective."
 ww1_russia.20.a: "Whites VS Reds"
 ww1_russia.21.t: "Soviet-Japanese Basic Convention"
 ww1_russia.21.d: "Today started negotiations between Soviets and Japan. After long war both Soviet Union and Entente suffered great loses. Now Lev Mikhailovich Karakhan of the Soviet Union and Kenkichi Yoshizawa of Japan want to sign treaty to end this war and eventually recognize Soviet Union as a state and retreat from Russia."
 ww1_russia.21.a: "It's time to stop"
 ww1_russia.21.b: "Never"
 ww1_russia.22.t: "Election: Kerensky vs Lvov"
 ww1_russia.22.d: "New electrions have been called by the tsar. The two main contenders are Georgy Lvov, supportive of giving mor epower to the tsar and Alexander Kerenksy, a socilal democrat supporting a constitutional monarchy."
 ww1_russia.22.a: "Ai Ai Kerensky"
 ww1_russia.22.b: "Lvov from Lvóv"
 ww1_russia.23.t: "Russia Demands Subjugation"
 ww1_russia.23.d: ""
 ww1_russia.23.a: "We simply have to..."
 ww1_russia.23.b: "No."
 ww1_russia.24.t: "Persia Accepted"
 ww1_russia.24.d: ""
 ww1_russia.24.a: "Finally it's game over..."
 ww1_russia.25.t: "Persia Rejected"
 ww1_russia.25.d: ""
 ww1_russia.25.a: "What we can do about it..."
 ww1_russia.25.b: "They will pay!"
 ww1_russia.26.t: "Tsar Nicholas Abdicates!"
 ww1_russia.26.d: "Demonstrations have forced the poor Tsar into official abdication. Though the Tsar has named Grand Duke Michael as his successor, the Duke has declined this offer."
 ww1_russia.26.a: "What happens now?"
 ww1_russia.27.t: "Russian influence in the Korean Peninsula"
 ww1_russia.27.d: "With the defeat of Japan and us pushing them from the continent, the question of what we should do with Korea has arisen, while we could keep them close to us, it may be a better idea to just guarantee their independence, or leave the korean peninsula entirely"
 ww1_russia.27.a: "We will keep the Koreans close to us, to safeguard them from others of course!"
 ww1_russia.27.b: "We will give the Koreans independence, but guarantee their independence"
 ww1_russia.27.c: "We will leave the Koreans to their fate, whatever that may be"
 ww1_russia.28.t: "Russian terms for peace"
 ww1_russia.28.d: "The Russians have presented their terms for peace, in our current situation we have little choice but to accept, they demand we leave Korea, and cede Dalian, Karafuto, and the Kurils to their rule as well as give them 20% of our fleet"
 ww1_russia.28.a: "We need time to recover"
 ww1_russia.29.t: "Japanese terms for peace"
 ww1_russia.29.d: "The Japanese have presented their terms for peace, in our current situation we have little choice but to accept, they demand we cede everything east of Bratsk"
 ww1_russia.29.a: "We need time to recover"
 ww1_russia.30.t: "Candidates for Manchurian Leadership"
 ww1_russia.30.d: "With the establishment of our new Manchu puppet state, we need to choose who to put in charge"
 ww1_russia.30.a: "The Former Qing Emperor will rule in our stead"
 ww1_russia.30.b: "A local Warlord will do"
 ww1_russia.31.t: "Russian Victory in Second Russo-Japanese War"
 ww1_russia.31.d: "Russia has emerged victorious from the Second Russo-Japanese War and pushed Japan off the Asian mainland"
 ww1_russia.31.a: "The balance of power has shifted"
 ww1_russia.31.b: "A shameful display!"
 ww1_russia.31.c: "We have wiped away the shame of Tsushima!" 
 ww1_russia.32.t: "Japanese Victory in Second Russo-Japanese War"
 ww1_russia.32.d: "Japan has emerged victorious from the Second Russo-Japanese War and pushed Russia out of East Asia"
 ww1_russia.32.a: "The balance of power has shifted"
 ww1_russia.32.b: "A glorious victory!"
 ww1_russia.32.c: "We have been defeated for a second time..." 
 ww1_russia.33.t: "Zapadoslavia?"
 ww1_russia.33.d: "Our Polish Subject has requested a union with Czechoslovakia, do we want to allow this?"
 ww1_russia.33.a: "We must stand by our Pan-Slavic Ideals"
 ww1_russia.33.b: "They will be too strong together! Stop the union!"

