 RUS_from_the_lake_to_the_sea: "Revoke the Convention of 1907"
 RUS_from_the_lake_to_the_sea_desc: "The Anglo-Russian Convention of 1907 was signed on August 31, 1907, in Saint Petersburg. The Convention ended the long dispute over Persia. The United Kingdom promised to stay out of northern Persia, and Russia recognized southern Persia as part of the British sphere of influence."
