#Ideas
 MSM_USA_european_embarrassment: "European Embarrassment"
 MSM_USA_european_embarrassment_desc: "In attempting to show the European nations that we too are a Great Power, we have thoroughly embarrassed ourselves on the world stage"
 MSM_USA_european_loan_payments: "European Loan Payments"
 MSM_USA_european_loan_payments_desc: "The American Financial system is benefitting from loan payments from France and Britain"
 MSM_USA_trade_sanctions: "European Trade Sanctions"
 MSM_USA_trade_sanctions_desc: "Needless to say, our recent foreign policy decisions have left us with a less than preferential access to european markets"

 standard_oil: "Standard Oil"
 standard_oil_desc: "Founded by John D. Rockefeller, Standard Oil has become the largest oil refiner in the world, this amount of control has advantages and disadvantages for any partners they have, including the government"
 USA_MSM_benevolent_trusts: "Benevolent Trusts"
 MSM_USA_trust_busting: "Trust Busting"
 MSM_USA_payne_aldrich_act_1: "Payne-Aldrich Tariff Act"
 MSM_USA_payne_aldrich_act_1_desc: "The Payne-Aldrich Tariff Act, passed in 1909, was made in response to calls by President William H. Taft for lower tariffs. This bill caused criticism of the president, particularly by progressives, as it failed to decrease tariff rates enough to make a difference in the economy."
 MSM_USA_payne_aldrich_act_2: "Amended Payne-Aldrich Tariff Act"
 MSM_USA_payne_aldrich_act_2_desc: "The Payne-Aldrich Tariff Act, passed in 1909, was made in response to calls by President William H. Taft for lower tariffs. This bill caused criticism of the president, particularly by progressives, as it failed to decrease tariff rates enough to make a difference in the economy. It has since been amended to better benefit the American economy."
 MSM_USA_idea_non_standard_oil: "Better Synthetic Refineries"
 MSM_USA_federal_reserve_path_tooltip: "§GThe following national spirits will replace each other resulting in the creation of the Federal Reserve.§!"
 MSM_USA_idea_underwood_tariff_act: "Underwood Tariff Act"
 MSM_USA_idea_underwood_tariff_act_desc: "The Underwood Tariff Act, passed in 1913, was intended to reduce duties on most raw materials and manufactured goods. This had the effect of bringing the cost of most goods down to sustainable levels and reducing the cost of living overall. This act also levied an income tax for the first time ever, although this only affected those making more that $4000 a year."
 MSM_USA_idea_new_federal_tax: "New Federal Tax"
 MSM_USA_idea_new_federal_tax_desc: "A restoration of federal income is stimulating the economy, however levying more taxes does not help the government's popularity."
 MSM_USA_idea_central_bank_fed: "The Federal Reserve"
 MSM_USA_idea_central_bank_fed_desc: "The US central bank, The Federal Reserve, was created through the Federal Reseve Act of 1913. In the aftermath of the panic of 1907, a realization was had that a central bank with the authority to regulate the supply of US currency would be necessary to protect the value of the US dollar. The US Federal Reserve was created with the full power to regulate the supply of US dollar bill and in doing so protects the value of US currency."
 MSM_USA_idea_commercial_incentives: "Commercial Incentives"
 MSM_USA_idea_commercial_incentives_desc: "Through new incentives outlined by the current administration, the USA is more able to expand existing industries and will likely see tremendous growth in certain sectors."
 MSM_USA_idea_naval_buildup: "Naval Buildup"
 MSM_USA_idea_naval_buildup_desc: "American dockyards are seeing higher than usual output as the country undergoes a naval buildup."
 MSM_USA_idea_target_banks: "Target Banks"
 MSM_USA_idea_target_banks_desc: "In our struggle against the monopolies, we must target the banks."
