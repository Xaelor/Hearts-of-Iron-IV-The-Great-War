#Events
 MSMUSA.2.a: "Wilson's New Freedom"
 MSMUSA.2.b: "Roosevelt's New Nationalism"
 MSMUSA.2.c: "Taft's Progressive Conservatism"
 MSMUSA.2.d: "The election of 1912 are contested by three individuals, Wilson, Roosevelt, and Taft. Roosevelt's New Nationalism platform called for social insurance programs, an eight-hour workday, and a strong federal role in regulating the economy. Wilson's New Freedom platform called for tariff reform, banking reform, and a new antitrust law. Knowing that he had little chance of victory, Taft conducted a subdued campaign based on his own platform of Progressive Conservatism."
 MSMUSA.2.t: "What politic should we support?"
 MSMUSA.3.a: "This shall stabilize the nation."
 MSMUSA.3.d: "In 1912 Woodrow Wilson ran on the platform of 'New Freedom' which denounced what Wilson perceived as both Theodore Roosevelt's more paternalistic and collectivist New Nationalism as well as William Howard Taft's conservatism. A 'Bouban Democrat' Wilson promised lower tariffs, free trade, and trust breaking in his speeches, though the Progressive movement would encourage him to enact a more moderate form of Roosevet's proposals through the creation of a Federal Reserve and supprt for the income tax. While some of these policies might be costly in the short term in the long term they would both help keep consumers protected from economic recessions and make goods less expensive,' satisfying the populace for the moment."
 MSMUSA.3.t: "America chooses New Freedom"
 MSMUSA.4.t: "America chooses New Nationalism"
 MSMUSA.4.d: "In 1912 Theodore Roosevelt ran and his Progressive Party ran on a platform of 'New Nationalism', which promised large scale government reforms and a more progressive social policy. This platform would involve a democratic government in economic and social affairs much more so than the Democrats 'New Freedom' platform and William Howard Taft's conservative policies. With promises of a single payer health care system, a minimum wage, social insurance, women's suffrage and other progressive measures many lower to middle class Americans supported the reforms feeling they would make life easier for the common person and that it would help unify the country,' though it might take some time to adjust to the new changes and some of the measures would be quite expensive to enact."
 MSMUSA.4.a: "Teddy Wins!"
 MSMUSA.36.t: "The California Alien Land Law"
 MSMUSA.36.d: "California has passed a law that prohibits aliens from owning or posessing long-term leases for land. This law is intended to curb immigration from various countries in Asia and is making Japan upset in particular. We could allow this to happen or we could force California to recind this law."
 MSMUSA.36.a: "Allow it"
 MSMUSA.36.b: "Force them to recind"

