 TUR_ww1_oppression_minorities: "Oppress Minorities"
 TUR_ww1_oppression_minorities_desc: "Granted, it isn't very honorable... but these populations are accustomed to such practices. Besides, it allows us to divert public anger and attention, at least for a time, so we can find solutions to more pressing issues. A strong press campaign would be all it takes to point out convenient scapegoats!"
