 TUR_nationalist_education_ns: "Turkish Nationalism"
 TUR_secular_education_ns: "Secularized Education"
#Focuses
 #Contest Young Turks
 TUR_ww1_ContestYoungTurksReforms: "Contest the Young Turk Reforms"
 TUR_ww1_ContestYoungTurksReforms_desc: "The Young Turk reformists are leading our empire straight to disaster! Imposing a European-style constitution risks completely disrupting our political life, and the reforms they aspire to will not work. What awaits us is not prosperity, but turmoil. Many members of the government are convinced of this; we must take measures to counter their popularity."
 TUR_ww1_AbolishConstitution: "Abolish the Constitution"
 TUR_ww1_AbolishConstitution_desc: "This constitution is a failure, an overly hasty and rushed project that took nothing into account other than the oversized political ambition of its creators! It is nothing more than a piece of paper—let us tear it up now and form a new government."
 TUR_ww1_AbdulhamidII: "Restore Abdülhamid II to the Throne"
 TUR_ww1_AbdulhamidII_desc: "We believed Mehmed V would be a better choice than the old Abdülhamid II, but that was a mistake. Recent political events have shown that a large portion of our nation has not forgotten its old sovereign. He is still in Istanbul, under house arrest. We should get him out and restore him to his throne."
 TUR_ww1_military_youth: "Military Youth"
 TUR_ww1_military_youth_desc: "Our militaristic culture must reach our children as well! By instilling respect for the military and training the younger generations, we can ensure they grow up and enlist to serve our glorious regime. Some might call this exploitation... but it sounds much better when phrased as giving teenagers a bright future."
 TUR_ww1_PanIslamism: "Pan-Islamism"
 TUR_ww1_PanIslamism_desc: "The heart of Islam beats in Turkey, undeniably so. All Islamic peoples should unite in one and the same faith, demonstrating equal religious solidarity toward their brothers. If we integrate these principles into our governance of Turkey, it will be a first step toward the politico-religious unity we hope to establish one day."
 TUR_ww1_WorldwideCaliphate: "Worldwide Caliphate"
 TUR_ww1_WorldwideCaliphate_desc: "What religion can manage to rule over men while being so fragmented and scattered? There can be only one caliph at the head of a single caliphate—not several! Straight in line with pan-Islamism, we need a single sovereign who will adopt a policy coherent with all believers and finally enforce the laws of the Prophet."
 #Support Young Turks
 TUR_ww1_SupportYoungTurksReforms: "Support the Young Turk Reforms"
 TUR_ww1_SupportYoungTurksReforms_desc: "The world will not wait for us to modernize, and to enter the next era, Turkey must modernize, starting by getting rid of its sclerotic institutions. The Young Turks are right: we must establish a brand new state built around a strong, united nation and initiate an accelerated modernization of Turkish society, economy, and military."
 TUR_ww1_Nationalist_Path: "Three Pashas Era"
 TUR_ww1_Nationalist_Path_desc: ""
 TUR_ww1_centralizedpower: "Centralize the Empire"
 TUR_ww1_centralizedpower_desc: "By doubling the number of civil servants, we strengthen our capabilities for control and regulation over the entirety of our government, ensuring that nothing slips past us. The nation's efforts will be used far more effectively. Besides, it will keep the national paper industry booming..."
 TUR_ww1_nationalist_education: "Nationalist Education"
 TUR_ww1_nationalist_education_desc: ""
