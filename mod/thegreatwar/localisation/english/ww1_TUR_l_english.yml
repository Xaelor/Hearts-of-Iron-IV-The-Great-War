 TUR_ww1_Ataturk_path_desc: ""
 TUR_ww1_furher_modernization: "Further Modernize the State"
 TUR_ww1_furher_modernization_desc: ""
 TUR_ww1_education_reform: "Secularize the Education System"
 TUR_ww1_education_reform_desc: ""
 TUR_ww1_appoint_Ataturk: "Appoint Atatürk as Grand Vizier"
 TUR_ww1_appoint_Ataturk_desc: ""
 TUR_ww1_neutrality: "Neutral Foreign Policy"
 TUR_ww1_neutrality_desc: ""

 TUR_ww1_liberty_ethos_focus: "Ethos of Liberty"
 TUR_ww1_liberty_ethos_focus_desc: "We must beware of Western whims, but their aspiration for the freedom of peoples is nevertheless a good idea, provided it is applied unreservedly and to the end. We should adopt these ideals as our own and popularize them in our political life."
 TUR_ww1_freespeech: "Free Speech"
 TUR_ww1_freespeech_desc: "By granting people the right to freedom of speech and assembly, we ensure they can channel their anger and thoughts into something more creative. That said, anyone shouting 'FIRE!' in a crowded theater, or using terms a bit too explicit to describe the head of state's mother, will still end up in prison..."
 TUR_ww1_install_democracy: "Free Elections"
 TUR_ww1_install_democracy_desc: "Power always comes from the people. Holding free elections will at least give the illusion of direct democracy and proper representation for citizens, granting our government the legitimacy it lacked."
 TUR_ww1_abandon_claims: "Abandon Claims"
 TUR_ww1_abandon_claims_desc: "The old Ottoman claims no longer have any place; they are outdated and, frankly, needlessly poison our geopolitical position. We should contact the countries concerned and inform them that we no longer claim these territories. Besides, our empire is already plenty large enough as it is."
 TUR_ww1_france_friend: "Franco-Turkish Treaty"
 TUR_ww1_france_friend_desc: "French diplomats contacted us with a proposed treaty addressing the issues of Lebanese territories and the border demarcations to the south and east. This proposal makes good sense and would strengthen our relations with the French Republic. We should work on this..."
 TUR_ww1_Agreement_with_russia: "Agreement With the Russians"
 TUR_ww1_Agreement_with_russia_desc: ""

