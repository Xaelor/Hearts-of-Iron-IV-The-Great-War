 hsr_event.1.t: "Entente Demand for Burgenland"
 hsr_event.1.d: "On 20 July 1919, representatives of the Entente Powers informed the Hungarian government of their demands concerning the western Hungarian territories. During the Paris Peace Conference of 1919, Britain, France, Italy and the United States discussed the new territorial order in Central Europe following the collapse of the Austro-Hungarian Monarchy. The Austrian government had laid claim to territories in western Hungary, particularly those inhabited by a significant German-speaking population. The victorious Allied Powers consider the transfer of these territories to Austria necessary for establishing the new border between the two countries. On 10 September 1919, Austria's new territorial arrangements would be formally established by the Treaty of Saint-Germain. The Entente now demands that Hungary accept the transfer of Burgenland to Austria. If we do not accept, we risk further isolation and potential military action."
 hsr_event.1.a: "yeah i mean, of course"
 hsr_event.1.b: "we would like to inform the Entente about them to stop making dreams, this is and was a hungarian territory for decades!"