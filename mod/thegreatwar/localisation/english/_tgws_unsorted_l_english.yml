 #######Eventler
 ww1_germany.29.d: "Today a century long spanning emprie has collapsed.After the forced German isolation of Austro Hungarian Empire and the subsequent partition war.Empire collapsed shorlty after with the fall of Vienna.While most parts of the empire got absorbed into new realms house of Habsburg fled to remaining parts of Hungary.Experts say German will strike the Habsburgs one last time to erase their loyal family."
 ww1_ottoman.26.d: "In eastern part of the Anatolia lies a bunch of different ethnicities.As a part of the Treaty of Sevres and the Wilsons 14 points these minoritys are allowed to do free referandums to choose their future.While we can allow these referandums we can also just seize the weakness of Entente powers and ignore this part.What should we do?"
 ww1_ottoman.27.d: "With efforts to disarm the resistance groups started we gazed our eyes on the black sea region because of its active resistance against the Treaty of Sevres.While we can just ignore them but this will further destablize the country or we can send someone trusted to disarm the rebels.What should we do?"
 ww1_ottoman.28.d: "Grim news have arrived to the capital.After we send Mustafa Kemal Pasha to Samsun for disarming the population.He secretly builded a shadow government over our eastern vilayets and now he declared the cretion of a new Turkish state rival to us.We can join him for the Turkish liberation or we can stay loyal to the Sultan.What is your choice?"
 ww1_germany.30.d: "With Ukraine being firmly under our hand we gained acces to Crimea.They occupy important city of Sevastapol and we need that city if we want dominance in the Black Sea,so what should we do?"
 interwar_turkey.500.d: "Today at the newly liberated city of Konstantiniyye leader of the Turkish National Movement declared the creation of the Turkish Sultanate.While at the start National Government had suspicion for the Monarchy but after a series of conferences later government changed his mind and accepted the Sultan Abdulmejid II as the monarch of the state.With much of the world recognazing the new state.Hope of a Turkish golden age started."
